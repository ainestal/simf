    metamorphosis_armor_multiplier: 3.0
    metamorphosis_spell_id: 187827
    # Infernal Armor (talent 320331, Demon Hunter CLASS tree, level 30):
    # activates Immolation Aura's dormant armor effect (spell 258920 effect
    # #5, base 0%) to a real +20% armor while the Immolation Aura buff is up.
    # Pinned 2026-07-18 via live Wowhead tooltip ("Immolation Aura increases
    # your armor by 20%...") + SimC midnight source
    # (demon_hunter_t::composite_armor_multiplier():
    # `am *= pow(1 + spell.immolation_aura->effectN(5).percent(), stacks)`).
    # PHYSICAL ONLY (armor never reduces magic damage) — does not touch the
    # magic-DR residual (see docs/validation/phase4_vdh_magic_residual_leads_2026_07_18.md).
    # Window-gated on immolation_aura_spell_id being in event.active_buffs,
    # same pattern as Metamorphosis's armor multiplier — stacks multiplicatively
    # with it (both are armor_multiplier-type effects in SimC). Modeled
    # UNCONDITIONALLY (no talent gate): confirmed rank 2/2 taken by all 3
    # corpus fighters (2026-07-18 talent check against real WCL CombatantInfo
    # talentTree data), same "assumed baseline" convention already used for
    # Demon Spikes/Metamorphosis/Demonic Wards/Painbringer, since VDH has no
    # per-player talent-detection plumbing yet. Live/synthetic mode gets NO
    # credit (the policy has no Immolation-Aura-cast model) — same
    # calibration-path-first staging as Metamorphosis/Painbringer.
    infernal_armor_multiplier: 0.20
    immolation_aura_spell_id: 258920
    # Demonic Wards (spell 203513, SimC): flat -12% magic AND -12% physical =
    # -12% all-school always-on baseline DR. The clean analog of the Prot
    # Warrior Defensive Stance layer. (Stamina/armor live on Thick Skin 320380,
    # which is already baked into the COMBATANT_INFO armor snapshot we hydrate —
    # do NOT re-apply it.)
    demonic_wards_dr: 0.12
    # Soul Cleave + Frailty: 30 Fury → heals 25% missing HP + Frailty debuff
    # on target generates Soul Fragments that heal on pickup. Modeled as a
    # periodic self-heal in the policy tick — ~6 soul fragments/min in M+.
    # `soul_cleave_heal_pct_missing_hp` is itself a %-missing-HP APPROXIMATION
    # of the ability's real mechanic (a flat 240% Attack Power heal, per
    # Warcraft Wiki) — not a live tooltip transcription.
    #
    # PATCH 12.1.0 SCALAR BUMP (prepared 2026-08-07, held for ship ~Aug 11
    # 2026 — see patch/12.1.0-scalars branch / PR): Warcraft Wiki's Patch
    # 12.1.0 page states the AP coefficient rises 240% -> 300% (a relative
    # +25%), confirmed by a PTR spell-data scrape landing at exactly that
    # ratio. A straight x1.25 on the existing constant is a defensible
    # same-fidelity carry-forward — VDH has never corpus-fit this constant
    # (`calibrated: false`, no VDH log corpus exists), so 0.25 was never a
    # calibrated value to begin with, just an unvalidated AP-to-%-missing-HP
    # conversion; x1.25 preserves that same conversion ratio rather than
    # re-deriving it against a representative AP/max-HP profile.
    soul_cleave_heal_pct_missing_hp: 0.3125
    soul_fragment_heal_pct_max_hp: 0.06
    soul_fragments_per_minute: 11.0   # active M+ pace; Spirit Bomb + Soul Cleave + procs
    # Fiery Brand (debuff 207744, SimC): -40% damage taken from the branded
    # target, 12s on ~60s CD. Averaged here (target-side, so only a fraction of
    # M+ incoming is covered). Measured buff uptime ~38%; kept conservative.
    fiery_brand_target_dr: 0.40
    fiery_brand_avg_uptime_in_m_plus: 0.17
    # Void Reaver (talent 268175, Vengeance spec tree) layers a defensive
    # effect onto the existing Frailty debuff (247456, applied via Soul
    # Cleave/Fracture/Spirit Bomb): -5% all-school "damage to caster" from the
    # Frailty-debuffed mob (Wowhead tooltip + DB2 SpellEffect: EffectAura=269
    # A_MOD_DAMAGE_TO_CASTER, EffectBasePointsF=-5, school mask 127; capped at
    # 1 stack in Midnight — SpellAuraOptions.stack_amount=1, de-stacked from
    # the older Dragonflight/TWW multi-stack design). SimC source
    # (parse_target_effects gated on talent.vengeance.void_reaver) was
    # genuinely ambiguous on attacker vs defender side (its bucket placement
    # is demonstrably not a reliable signal — Fiery Brand's OWN confirmed-
    # attacker-side effect sits in the identical SimC bucket). RESOLVED
    # empirically 2026-07-18: per-hit forensics on all 3 WCL corpus fights
    # (same ability + same mob, Frailty-active vs not) show unmitigatedAmount
    # itself running ~5-15% lower while Frailty is up (AnonPlayerX2: a strikingly
    # tight ~0.91 cluster across 8 ability/mob pairs) — ATTACKER-SIDE,
    # already baked into logged damage, same bug class as Fiery Brand/Demo
    # Shout/Phalanx. Modeled live/synthetic-only (flat averaged like Fiery
    # Brand); NEVER in replay — wiring it there would double-count. Uptime
    # measured as the fraction of the tank's physical hits landing while the
    # attacking spawn carried Frailty (86.1%/91.5%/93.3% across the 3 corpus
    # fights, mean ~90%) — consistent with Soul Cleave being a near-constant
    # Fury spender against the tanked target in M+. Confirmed TAKEN (rank 1)
    # by all 3 corpus fighters. See
    # docs/validation/phase4_vdh_magic_residual_leads_2026_07_18.md.
    void_reaver_dr: 0.05
    void_reaver_avg_uptime_in_m_plus: 0.90
    # Painbringer (buff 212988, talent 207387): flat −3% ALL-school DR (school
    # mask 127) while the buff is up, refreshed on every Soul Fragment consume
    # (8s, ~95% observed uptime on the 3-fight WCL corpus). NON-stacking in
    # Midnight (SpellAuraOptions.CumulativeAura = 1 — the DF-era per-stack
    # version is gone). Value pinned v38 from live Wowhead tooltip + DB2 build
    # 12.0.7.68367: the buff's effect base IS 0 and the −3 arrives via the
    # talent's A_ADD_FLAT_LABEL_MODIFIER (label 2406) — which is why the old
    # audit read "effect base 0" and correctly refused to guess. Window-gated
    # on event.active_buffs in replay (real log windows); the live path gets
    # NO credit yet (policy has no Soul-Fragment-consume model — same
    # calibration-path-first staging as Metamorphosis armor / Brewmaster PT).
    painbringer_dr: 0.03
    painbringer_spell_id: 212988
    # Party/healer aura DR — structural parity with the warrior + Guardian
    # paths (same values). Replay opt-in via state.party_magic_dr_active; NOT
    # active in Monte-Carlo calibration runs (contributes zero to the WCL
    # corpus deltas — every spec's corpus is judged with it off).
    party_dr_by_school:
      all: 0.05
      magic: 0.00
    # Base values
    base_parry_chance: 0.05         # base VDH parry (no shield)
    base_dodge_chance: 0.08         # VDH has higher base dodge than Warrior

  protection_paladin:
    # characterized — three passes so far, all on the Bruttah corpus (Pit
    # of Saron +2 / Algeth'ar Academy +2 / Magisters' Terrace +5 / Seat of the
    # Triumvirate +9): F15 block-value armor-curve port + hydrate-snapshot fix
    # (2026-07-03, docs/validation/phase4_protpal_block_value_2026_07_03.md),
    # Ardent Defender 30%/12s/90s (2026-07-03,
    # docs/validation/phase4_protpal_ardent_defender_2026_07_03.md), and the
    # Holy-Power/WoG economy correction (2026-07-04, v39 above — WoG is
    # mana-funded and never competed with SotR; generation re-derived from
    # measured uptime; docs/validation/
    # phase4_protpal_holy_power_economy_2026_07_04.md, incl. the post-fix
    # 4-log deltas at canonical K). runner.py's buff-window-blind cheat-death
    # gate FIXED 2026-07-06 (Top-5 #3 prerequisite — see
    # docs/validation/phase4_healer_throughput_cap_2026_07_06.md). Remaining
    # named candidates for the gap: Divine Bulwark's mastery-scaled
    # spell-block chance (unmodeled), the blocked-DoT absorb (unmodeled),
    # Sanctuary's Consecration-linger DR (approximated by consecration_dr),
    # and the cross-spec ~5-7% run-scoped wedge the Brewmaster decomposition
    # surfaced on the warrior corpus too (that corpus was `calibrated` when
    # this was written 2026-07-04; it is `characterized` as of 2026-07-18,
    # downgraded further and re-ratified at RMSE 0.162 on 2026-07-21).
    calibration_tier: characterized
    # Base values for paladin (overrides `base:` block when class_spec == protection_paladin).
    base_block_chance: 0.10               # has shield like Prot Warrior
    base_mastery_pct: 0.12                # Divine Bulwark base mastery
    # Mastery: Divine Bulwark — every 1% mastery adds block chance (spell 76671:
    # "requires Paladin... increases your chance to block by 8.0%" at 8% base
    # mastery → coefficient 1.0, confirmed against live Wowhead tooltip data,
    # F15 2026-07-03). No flat-DR component exists on Divine Bulwark in
    # Midnight — the previous `mastery_dr_scaling` term modeled a DF/TWW-era
    # rank-2 effect that SimC's midnight branch no longer applies (rank 2 is
    # now spell-block chance; the old flat-DR role moved to the Sanctuary
    # talent, already approximated by `consecration_dr` below).
    mastery_block_chance_scaling: 1.0
    # Shield of the Righteous: 3 Holy Power → ~4.5s phys DR window. Stacks duration.
    sotr_holy_power_cost: 3
    sotr_duration_s: 4.5
    sotr_physical_dr: 0.20                # 20% phys DR window (block + DR similar to SB but smaller)
    sotr_block_chance_during: 1.0         # 100% block while SotR up
    # Holy Power generation (rotation abstraction): smooth income the policy
    # spends on SotR presses near buff expiry. Re-derived 2026-07-04 from the
    # 4-log Bruttah corpus by back-solving the MEASURED SotR buff uptime
    # (buff 132403: 78.1/81.4/85.5/85.8%) at each run's hydrated haste
    # (19.8/23.3/19.8/21.1%): base = 3×uptime/(sotr_duration_s×(1+haste)),
    # duration-weighted 0.4584 → 0.46. Deliberately NOT raw energize income
    # (0.582 HP/s spendable, weighted): Bruttah presses at pool cap and loses
    # pandemic extension (realized 3.5-4.2s buff per press vs the sim's
    # near-expiry 4.5s), so income-parity would overshoot her real coverage.
    # Cross-player anchor: AnonPPal1's 86-87% uptime at 9.58% haste
    # back-solves to 0.526 — the ABSOLUTE rates agree (0.55-0.58 HP/s) across
    # an 11pp haste gap, so the (1+haste) scaling is likely too aggressive;
    # single-build caveat, flagged in the validation doc.
    holy_power_per_second_base: 0.46
    holy_power_max: 5
    # Word of Glory — funded by MANA in Midnight 12.0.5 for the large
    # majority of casts, NOT Holy Power. Log-proven 2026-07-04: 93.5%
    # (145/155) of WoG cast lines read powerType=0 cost=50000 (pool 250000)
    # and never touch Holy Power. A minority — 6.5% (10/155) — pipe-join a
    # Holy Power leg alongside the mana leg (e.g. ptype="9|0" cost="3|50000":
    # that press draws BOTH 3 Holy Power AND 50k mana; mechanism
    # uncharacterized, materiality to these constants negligible — ~30 HP
    # over 4,778s ≈1% of HP income). Including these hybrid casts (charged
    # like a paid SotR press) in the pool-conservation replay resolves
    # 917/919 pre-cast Holy Power pool readings exactly (99.8%); the 2
    # residual mismatches are unexplained noise, not a further hidden draw.
    # `scripts/analyze_protpal_holy_power.py` reproduces this split. A
    # further 6.5% (10/155, disjoint from the hybrid set) are free-proc
    # (cost 0 in every resource) and are NOT modeled — sim WoG is slightly
    # scarcer than the real one. Regen is the pooled median of 34
    # between-cast estimates (~1% of max/s; noisy upper tail from untracked
    # income) — sustains one WoG per ~20s after a 5-cast pool burst, matching
    # her observed 13-35s median cadence.
    wog_mana_cost: 50000
    mana_max: 250000
    mana_regen_per_s: 2500
    # WoG heal size: measured PER PRESS (summing same-cast self-heal events —
    # a press sometimes fires more than one, e.g. a bonus/echo heal alongside
    # the main one — before dividing by max HP; per-event averaging would
    # dilute this) over 143 presses across the corpus: mean 18.3% / median
    # 16.9% of max HP (previous 0.30 PLACEHOLDER was ~1.6× too generous; an
    # earlier per-EVENT-not-per-press read of this same corpus had measured
    # 0.15, understating it by ~20%).
    wog_heal_pct_of_max_hp: 0.18
    wog_threshold_hp_pct: 0.55            # press WoG below this HP (policy heuristic — deliberately NOT retuned to Bruttah)
    # Ardent Defender: 30% DR for 12s on 90s CD (base; Unbreakable Spirit talent
    # cuts this further, not modeled — see docs/validation/phase4_protpal_ardent_defender_2026_07_03.md),
    # cheat-death at <20% HP heals to 20% once per CD.
    ardent_defender_dr: 0.30
    ardent_defender_duration_s: 12.0
    ardent_defender_cooldown_s: 90.0
    ardent_defender_cheat_death_threshold: 0.20
    ardent_defender_cheat_death_heal_pct: 0.20
    # Sentinel: stacking absorb generated passively during combat. Modeled as ~3% max HP / 10s.
    sentinel_absorb_pct_per_10s: 0.03
    sentinel_max_pct_of_max_hp: 0.30
    # Consecration: always-on 5% damage reduction while standing in it. Avg uptime ~90% in M+.
    consecration_dr: 0.05
    consecration_avg_uptime: 0.90
    # Divine Shield/Bubble taunt-removal CD not modeled (not a survivability button in M+).
