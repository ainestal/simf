    # docs/validation/protwarrior_shield_block_fix_2026_07_21.md,
    # protwarrior_post_shield_block_bias_decomposition_2026_07_21.md, and
    # protwarrior_sb_press_cadence_2026_07_21.md (confirms this is the final
