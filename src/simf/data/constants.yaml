# Bumped when the log-analysis pipeline shape changes (new fields on
# DeathEvent / NPCAttribution, segmenter rework, mitigation-audit row
# additions, etc.) — anything that would make a cached pickle from an
# older simf incorrect to deserialize even if `constants_version` hasn't
# moved. Evolves INDEPENDENTLY from `constants_version`: engine math and
# analysis pipeline shape change for different reasons.
# Used by `simf.io.log_analysis_cache` to invalidate every cached log
# bundle on a pipeline bump.
# v5 (2026-06-29): WCL DamageTakenEvents now carry a spawn-unique source_guid
# (WCL actor id + instance) so the defensive-coverage join can credit a
# tank-applied enemy debuff (Demoralizing Shout) spawn-precisely. Bumped so
# warm WCL bundle caches re-build with the new field before the join reads it.
#
# v6 (2026-07-02): interruptible-cast coverage lever. `_cached_coverage_report`'s
# disk-cached tuple grew a 3rd element (`interrupted_spell_ids`) — an old 2-tuple
# cache entry would crash on unpack, not just serve a stale-but-valid payload.
#
# v7 (2026-07-03): cooldown-aware "kick was available" split. Same hazard as
# v6 — `_cached_coverage_report`'s disk-cached tuple grew a 4th element
# (`own_interrupt_cast_times`), so an old 3-tuple cache entry must be
# invalidated rather than crash on unpack.
analysis_version: 7

# Damage-school badge colors (Brutoh idea #d, 2026-05-25).
# Used on every "Why did I die?" surface to prefix ability names with a
# colored pill so the user can see at a glance whether a hit was magic
# (use Spell Reflect) or physical (use Shield Block). Color is decoration
# only — every badge also carries a text label (WCAG 1.4.1).
#
# Contrast pairs measured against `--surface-elev` (#ffffff) AND
# `--surface-base` (#f4f1ea) — every fg/bg combination clears WCAG 2.2
# AA 4.5:1 because the pill text is 12px bold on a 0.16-alpha tint of
# the bg color (so the readable text uses the `fg` ink directly, not
# the pill fill). The `fg` is the text/border color; the `bg` is the
# pill fill at full saturation (CSS adds the alpha).
#
# Bleed gets the same physical fg but a distinct text suffix
# `Physical (bleed)` so the user knows armor mit didn't apply to that
# bucket — surfaced because the engine carries `is_bleed` per event
# (see core/bleed_detection.py).
damage_school_colors:
  physical:  { fg: "#7a3d2c", bg: "#c9a594" }   # bronze — matches --accent-warn
  holy:      { fg: "#7a5e1c", bg: "#e2cf8e" }   # warm gold
  fire:      { fg: "#8b3a1f", bg: "#e2a08a" }   # ember
  nature:    { fg: "#2f5f2a", bg: "#a8c99c" }   # leaf
  frost:     { fg: "#2a5b7a", bg: "#a8c9d9" }   # ice
  shadow:    { fg: "#4a3168", bg: "#bba8d4" }   # plum
  arcane:    { fg: "#6b2e6e", bg: "#d4a8d4" }   # rose-violet
  unknown:   { fg: "#4a4a4a", bg: "#cccccc" }   # neutral fallback

# ── Defensive-coverage coaching (the hit-vs-coverage join) ────────────────────
#
# Powers the "Defensive coverage on your biggest hits" section of the
# Why-died surface. The headline analysis is the COVERAGE JOIN: the tank's
# top-N biggest damage-taken events × which defensive cooldown was active at
# each hit's timestamp. It is read 100% from the combat log (damage events +
# buff/debuff aura events) and touches NO simulation — so it is
# model-independent AND spec-agnostic (works on a `calibrated: false` spec).
# This is the deliberate design (ROADMAP "Survivability coaching" entry,
# validated 2026-06-29): the sim-vs-log gap is the counterfactual no other
# tool computes, but the COACHING surface bills nothing to the model.
#
# HONESTY RULES baked into this registry (do not relax without re-reading the
# ROADMAP entry's "MUST-FIX honesty traps"):
#   1. NEVER enumerate a DELETED ability. Rage of the Sleeper (spell 200851)
#      was removed from the game in patch 12.0.0 and stripped from the engine
#      (PR #218). It must NOT appear below. A test greps this block for 200851.
#   2. Levers are TALENT-GATED at runtime: a defensive only renders if the log
#      shows ≥1 application/cast of it. A registry entry is a *candidate*, not
#      a claim the player took the talent — so an over-inclusive list is safe
#      (un-talented levers silently never match), but a wrong spell_id causes a
#      fail-safe UNDER-credit (it just never matches), never an over-credit.
#   3. `role` decides HOW the lever is judged (the core design rule):
#        - role: coverage  → a reactive/emergency DR cooldown, judged by SPIKE
#          COVERAGE (was it up for the big hit?). Pressing these on cooldown is
#          *wrong*; holding for the tank-buster is correct play — so they only
#          ever appear in the hit-vs-coverage join, never as a raw-uptime stat.
#        - role: continuous → a near-permanent active-mitigation tool, judged by
#          UPTIME (constant pack damage → you want it up always). Shown as a
#          plain log-derived uptime line, EXCLUDED from the "no defensive up"
#          determination (Shield Block not being up for one nature spike is not
#          a failure). No "achievable" benchmark — that would be circular.
#   4. `school_scope` gates which hits a lever can cover: all | physical | magic.
#      A physical-only lever (Shield Block, Ironfur) never "covers" a Nature
#      hit. Bleeds count as physical.
#   5. `detect` is the log signal:
#        - buff             → a BUFF aura applied to the tank (most CDs).
#        - debuff_on_source → an enemy DEBUFF the tank applies (e.g. Demoralizing
#          Shout reduces the *enemy's* damage). A hit is covered only if the
#          hit's own source had the debuff active — never a blanket window, so
#          mobs the debuff never touched are not falsely credited. Needs
#          duration_s as a safety cap when a removal isn't logged.
#   6. `tier` (default major) separates a personal big-button DR from a weaker
#      one. `minor` = a partial-reduction lever (Demoralizing Shout, a −20%
#      enemy debuff). A hit covered ONLY by a minor lever renders as "partial"
#      and never flips the verdict to "every hit had a major defensive up" — so
#      a 20% shave never reads the same as a 40-50% personal cooldown.
#   7. `cooldown_s` (coverage levers only) is the base recharge time. It powers
#      the "was a cooldown even AVAILABLE?" split on UNCOVERED hits: a hit you
#      ate with your whole major kit on cooldown (spent earlier) is a pull-size
#      / route problem, NOT a reaction-timing miss, and must not read as "you
#      should have pressed something." Use the BASE cooldown (ignore charges,
#      haste and talent reductions): that OVER-states recharge time, so the
#      split errs toward "kit was spent" (the charitable, non-blaming call) and
#      never wrongly tells a player a cooldown was ready when it wasn't. A lever
#      with no `cooldown_s` is simply left out of the availability split (the hit
#      falls back to the plain "no cooldown up" line) — fail-safe, never a lie.
#
# NOTE: editing this block changes which levers are detected; bump
# `constants_version` above in the same change so the cached coverage windows
# (keyed on constants_version) invalidate.
#
# VERIFICATION STATUS: protection_warrior is verified against a real Brutoh log;
# guardian_druid is from the validated prototype. The other four specs list
# their best-known signature DR cooldowns (buff-detected, conservative scope)
# pending a per-spec log to verify spell_ids — the fail-safe property above
# means an incomplete list under-shows but never lies.
coaching:
  top_hits_n: 8           # how many of the biggest hits to join against coverage
  min_events_for_verdict: 20  # below this the run is too short to coach on
  defensives:
    protection_warrior:
      - { spell_id: 871,    name: "Shield Wall",        school_scope: all,      role: coverage,   detect: buff, cooldown_s: 240 }
      - { spell_id: 12975,  name: "Last Stand",         school_scope: all,      role: coverage,   detect: buff, cooldown_s: 180 }
      - { spell_id: 1160,   name: "Demoralizing Shout", school_scope: all,      role: coverage,   detect: debuff_on_source, duration_s: 8.0, tier: minor, cooldown_s: 45 }
      - { spell_id: 132404, name: "Shield Block",       school_scope: physical, role: continuous, detect: buff }
    guardian_druid:
      # Rage of the Sleeper (200851) deliberately ABSENT — deleted in 12.0.0.
      - { spell_id: 61336,  name: "Survival Instincts", school_scope: all,      role: coverage,   detect: buff, cooldown_s: 180 }
      - { spell_id: 22812,  name: "Barkskin",           school_scope: all,      role: coverage,   detect: buff, cooldown_s: 60 }
      - { spell_id: 102558, name: "Incarnation",        school_scope: physical, role: coverage,   detect: buff, cooldown_s: 180 }
      - { spell_id: 192081, name: "Ironfur",            school_scope: physical, role: continuous, detect: buff }
    protection_paladin:
      - { spell_id: 31850,  name: "Ardent Defender",        school_scope: all,      role: coverage,   detect: buff, cooldown_s: 90 }
      - { spell_id: 86659,  name: "Guardian of Ancient Kings", school_scope: all,   role: coverage,   detect: buff, cooldown_s: 180 }
      # Divine Shield only avoids the classic "boss re-aggros the party" tanking
      # trap with the Final Stand talent (taunts everything on cast) — Final
      # Stand is the default Midnight M+ capstone pick, so this stays listed.
      # The talent gate (>=1 detected cast) is the only guard against a
      # Final-Stand-less build getting coached to press this while tanking.
      - { spell_id: 642,    name: "Divine Shield",           school_scope: all,      role: coverage,   detect: buff, cooldown_s: 300 }
      - { spell_id: 132403, name: "Shield of the Righteous",  school_scope: physical, role: continuous, detect: buff }
    blood_death_knight:
      - { spell_id: 55233,  name: "Vampiric Blood",      school_scope: all,      role: coverage,   detect: buff, cooldown_s: 90 }
      - { spell_id: 48792,  name: "Icebound Fortitude",  school_scope: all,      role: coverage,   detect: buff, cooldown_s: 120 }
      # Dancing Rune Weapon's DR is +20% parry chance (probabilistic avoidance,
      # not a flat cut) — minor tier, the same class as Demoralizing Shout's shave.
      - { spell_id: 49028,  name: "Dancing Rune Weapon", school_scope: physical, role: coverage,   detect: buff, cooldown_s: 120, tier: minor }
      - { spell_id: 48707,  name: "Anti-Magic Shell",    school_scope: magic,    role: coverage,   detect: buff, cooldown_s: 60 }
      - { spell_id: 195181, name: "Bone Shield",         school_scope: physical, role: continuous, detect: buff }
      - { spell_id: 51052,  name: "Anti-Magic Zone",     school_scope: magic,    role: coverage,   detect: buff, cooldown_s: 240, tier: minor }
      - { spell_id: 194679, name: "Rune Tap",            school_scope: all,      role: coverage,   detect: buff, tier: minor }
    vengeance_demon_hunter:
      # Metamorphosis (Vengeance) grants +40% max HP and +200% armor only — no
      # flat all-school DR line — so it mitigates physical hits only.
      - { spell_id: 187827, name: "Metamorphosis", school_scope: physical, role: coverage,   detect: buff, cooldown_s: 180 }
      - { spell_id: 204021, name: "Fiery Brand",   school_scope: all,      role: coverage,   detect: buff, cooldown_s: 60 }
      - { spell_id: 203720, name: "Demon Spikes",  school_scope: physical, role: continuous, detect: buff }
      # Netherwalk (196555) deliberately ABSENT — cut from the Vengeance kit in
      # the Midnight redesign; do not re-add (mirrors the Guardian RotS pattern).
    brewmaster_monk:
      - { spell_id: 115203, name: "Fortifying Brew",     school_scope: all,      role: coverage,   detect: buff, cooldown_s: 360 }
      - { spell_id: 122278, name: "Dampen Harm",         school_scope: all,      role: coverage,   detect: buff, cooldown_s: 120 }
      - { spell_id: 122783, name: "Diffuse Magic",       school_scope: magic,    role: coverage,   detect: buff, cooldown_s: 90 }
      # Celestial Brew is a reactive absorb-shield CD, not a keep-it-up tool —
      # role: coverage (was miscategorized as continuous, which hid it from the
      # hit-vs-coverage join entirely).
      - { spell_id: 322507, name: "Celestial Brew",      school_scope: all,      role: coverage,   detect: buff, cooldown_s: 45 }

  # Baseline interrupt ability per tank spec — powers ONLY the cooldown-aware
  # "kick was available" split (core/coaching.py HitCoverage.kick_was_ready),
  # never the interruptible-evidence gate itself (that stays log/WCL-proven
  # per-spell, see the honesty-rules docstring in core/coaching.py). Unlike
  # boss-ability interruptibility, every spec's interrupt is a long-stable
  # baseline ability (not talent-gated), so this IS safe to hand-curate.
  # Spell IDs + 15s base cooldown confirmed against Wowhead (live, 2026-07-03)
  # for Midnight 12.0.5; Mind Freeze (47528) cross-validated against a real
  # WCL Interrupts-dataType payload the same day.
  interrupts:
    protection_warrior:     { spell_id: 6552,   name: "Pummel",            cooldown_s: 15 }
    protection_paladin:     { spell_id: 96231,  name: "Rebuke",            cooldown_s: 15 }
    blood_death_knight:     { spell_id: 47528,  name: "Mind Freeze",       cooldown_s: 15 }
    vengeance_demon_hunter: { spell_id: 183752, name: "Disrupt",           cooldown_s: 15 }
    brewmaster_monk:        { spell_id: 116705, name: "Spear Hand Strike", cooldown_s: 15 }
    guardian_druid:         { spell_id: 106839, name: "Skull Bash",        cooldown_s: 15 }

# Gear hard caps — used by the upgrade-impact panel and the slot dialog's
# "compare at ilvl" control to clamp projected ilvls. Update each season as
# the upgrade tracks change.
gear:
  # Per-category reachable ilvl ceilings (Midnight 12.0.5 S1). Empirically
  # grounded in `slot_high_watermarks` from real exports: armor slots top out
  # at 289 (crest track max — Voidcore does NOT apply to armor, confirmed by
  # a real player 2026-07-04, so this IS the true ceiling, not an
  # intermediate step); trinkets and weapons reach 298 via Voidcore (+6 on
  # top of their own crest-track max, the only slots Voidcore can go on).
  # A single flat "season cap" number used to live here instead
  # (`ilvl_cap_current_season: 295`, removed 2026-07-04) — it silently
  # conflated the two categories and let the upgrade-impact ranker suggest
  # "upgrading" an armor piece already at its own max, which is impossible
  # in-game on every axis. Never reintroduce a flat cap; always key by
  # category (or slot, via `category_ceiling`/`category_for_slot`).
  # Refine as the season's upgrade tracks change; the player's own account
  # watermark (parsed from their export) further clamps this per-slot.
  ilvl_ceiling_by_category:
    armor: 289
    trinket: 298
    weapon: 298

  # Item levels a single upgrade-track level adds in the endgame band. Midnight
  # 12.0.5 tracks are 6-rank and step ~+3-4 ilvl/level (pattern ≈ +4/+3/+3/+3/+4);
  # 3 is the conservative round number (slightly OVER-estimates levels, the safe
  # direction for a cost). Used to render an APPROXIMATE crest cost ("+30 ilvl ·
  # ≈10 upgrade levels") on each normalized comparison. Exact crest tier +
  # quantity per level is drift-prone per patch and intentionally NOT hardcoded
  # here as a cost — see crest_currencies below + ROADMAP.
  ilvl_per_upgrade_level: 3

  # Upgrade crest currencies (Midnight 12.0.5 S1). Currency IDs are VERIFIED
  # present in real-export `upgrade_currencies` strings; names are likely
  # (guide-sourced); ≈20 crests/level is likely-not-verified. NOT used for the
  # v1 cost display (which shows upgrade *levels*, not crest counts) — kept as a
  # reference for a future "you have N crests" surface and to document the trap.
  #
  # ⚠️ The export's `upgrade_currencies` string is the addon's RAW currency dump,
  # NOT a semantic crest list: it ALSO contains Honor (id 1792, often thousands)
  # and catalyst charges. Filter out `crest_excluded_currency_ids` before
  # treating parsed entries as crests, or a "crest balance" reads ~2789 Honor as
  # an upgrade currency. (Confirmed against Brutoh's 2026-05-29 export.)
  crest_currencies:
    3383: { name: "Adventurer Dawncrest", track: "Adventurer" }
    3341: { name: "Veteran Dawncrest", track: "Veteran" }
    3343: { name: "Champion Dawncrest", track: "Champion" }
    3345: { name: "Hero Dawncrest", track: "Hero" }
    3347: { name: "Myth Dawncrest", track: "Myth" }
  crest_excluded_currency_ids: [1792]  # Honor (PvP) — in the dump, not a crest

  # Item-quality border for the gear paperdoll (mirrors WoW's quality-colored
  # item frame). ItemSpec carries NO quality field — the /simc export and the
  # Wowhead-fallback stats lookup don't surface one — so we apply an EPIC FLOOR:
  # every equipped / bag / vault piece in the M+ endgame band is at least epic,
  # so an unknown item renders the epic (purple) border. A small allowlist
  # promotes specific item_ids to the legendary (orange) border. Only the
  # CLASSIFICATION lives here; the hex colors are canonical Blizzard quality
  # values carried as CSS tokens (--q-epic / --q-legendary) in the stylesheet,
  # so a palette tweak doesn't touch this data and this data doesn't touch CSS.
  quality_border:
    default: epic              # epic floor — nothing in the endgame band drops below purple
    # Equippable legendary item_ids (orange border). Seed empty: Midnight
    # 12.0.5 S1 has no equippable legendary confirmed in the export corpus
    # yet. Append ids as they appear — no Python change needed.
    legendary_item_ids: []

  # Upgrade-track position per rank bonus_id — feeds the paperdoll's
  # "Myth 6/6 · i289" badge (replaces a bare ilvl). VERIFIED 2026-06-19 by
  # diffing the same item_id across the repo .simc corpus (the rank id is the
  # one that SWAPS when an item's ilvl changes — not the high-frequency generic
  # flags 6652/13440/3157/40/42) and cross-referencing warcraft.wiki "Midnight
  # Season 1" (Hero 259-276, Myth 272-289). Every tracked item in the corpus
  # climbs to 289 = Myth 6/6, which disambiguates the track.
  #
  # HONESTY CONTRACT (see io/upgrade_track.py): only ids LISTED here name a
  # track. Everything else degrades to ilvl-only. We NEVER infer a track from
  # ilvl alone — ilvl→(track,rank) is many-to-one (272 = Hero 5/6 OR Myth 1/6),
  # so that would lie. ⚠️ This table is patch-specific and WILL drift: the live
  # data already shows weapon/trinket ilvls (298) above the wiki's 289 cap.
  # Re-verify against the export corpus each season; add ids, don't guess them.
  #
  # NOT listed (degrade to ilvl-only, on purpose): Myth 4/6 (282 — no id seen
  # in the corpus); the rare variant 12802 (276, one old snapshot) and 13653
  # (285 trinket, one obs) — too thin to assert a track; any Hero/Champion/
  # lower rank other than 12798 below (no PvE-Myth corpus coverage);
  # crafted gear (different bonus space).
  #
  # CORRECTED 2026-07-04: `12798` was originally verified as "Myth 2/6"
  # (2026-06-19 pass) by assuming every climbing item in the corpus reached
  # Myth 6/6 — wrong for this one. A real player's ring carrying this exact
  # id (`examples/anonguardian1-simc.txt` finger2) turned out to be "Hero 6/6" per
  # the player directly, confirmed independently by fetching Wowhead's own
  # item tooltip for that id combination (`Upgrade Level: Hero 6/6`, not
  # Myth — see `wowhead.com/item={id}?bonus=...:12798&xml`). This means the
  # 2026-06-19 "climbs to 289" assumption doesn't hold for every corpus item
  # — a real methodology gap, not just one wrong number: an item ALREADY
  # maxed on Hero (276) looks identical, ilvl-wise, to an early Myth rank,
  # exactly the "many-to-one" trap this table's own honesty contract warns
  # about. Re-verify any FUTURE addition to this table against the item's
  # own "Upgrade Level" tooltip text, not just its position in an ilvl climb.
  upgrade_track_ranks:
    12801: { track: Myth, rank: 1, max_rank: 6, ilvl: 272 }
    12798: { track: Hero, rank: 6, max_rank: 6, ilvl: 276 }
    12803: { track: Myth, rank: 3, max_rank: 6, ilvl: 279 }
    12805: { track: Myth, rank: 5, max_rank: 6, ilvl: 285 }
    12806: { track: Myth, rank: 6, max_rank: 6, ilvl: 289 }
    # Weapon/trinket ceiling (298), above the 289 armor cap — rank doesn't map
    # cleanly to the 6-rank armor ladder, so track-only (renders "Myth · i298").
    13654: { track: Myth, ilvl: 298 }

  # Track tint for the badge — simf's own readable hues (NOT Blizzard-canonical),
  # picked to clear WCAG 4.5:1 text contrast on the cream paper. Only Myth
  # renders today (the only verified track above); the rest are defined so a
  # future Hero/Champion id renders tinted without a code change. A track with
  # no entry here falls back to the muted ilvl color.
  upgrade_track_colors:
    myth:       "#8a5a14"   # deep amber-gold — the top track
    hero:       "#5a3d8a"   # deep violet
    champion:   "#3a5a7a"   # steel blue
    veteran:    "#2f6a4a"   # forest
    adventurer: "#5a6a2a"   # olive
    explorer:   "#6a5a4a"   # taupe

rage:
  # Rage gained per physical hit (non-avoided). Models Revenge procs, auto-attack
  # rage, and Thunder Clap rage return that scale with incoming physical activity.
  # Formula: rage += raw_damage / max_hp * hit_rage_per_max_hp_fraction
  # Calibrated for ~2–3 rage/s in a typical M+ pull. PLACEHOLDER — verify vs logs.
  hit_rage_per_max_hp_fraction: 20.0   # 20 rage per 100% max HP in raw physical damage

  # Why-died rage-flow audit (parse_energize + timeline reconstruction).
  # SPELL_ENERGIZE in modern WoW combat logs emits `amount` in DISPLAYED rage
  # units already (warriors have a 0-100 displayed bar, `maxPower=1000` field is
  # internal tenths). We don't divide. Verified against Brutoh log
  # WoWCombatLog-051026_073906.txt: Shield Slam = 17, Shield Charge = 20,
  # Devastator = 2, Rage passive = 3 — all match in-game expectations.
  costs:
    # Approximate rage spent per cast. Read by core/death_analysis when
    # reconstructing rage timelines. Values err on the high side because
    # Revenge-with-proc is free; the audit slightly over-counts spend, which
    # over-reports starvation rather than under-reporting it (safer for a
    # diagnostic that points players at a real failure mode).
    shield_block: 30
    ignore_pain: 40
    revenge: 20             # APPROXIMATE — free with "Revenge!" proc; no proc-aware accounting yet
    thunder_clap: 5
  # A window where rage stays below this threshold for at least
  # `starvation_min_duration` seconds is flagged as a starvation window.
  # 20 rage = "can't afford the cheapest defensive (Shield Block at 30 or
  # Ignore Pain at 40) on demand" — the band where button discipline
  # collapses regardless of intent.
  starvation_threshold: 20
  starvation_min_duration: 3.0   # seconds; below this the gap is normal global-cooldown flow

calibration:
  # Per-K reference data so the UI can show a trust signal: which K is active,
  # global RMSE across all logs, and per-dungeon residual for the dungeon the
  # user has selected. Update whenever K is refit.
  k_active: 3430
  global_rmse: 0.080                  # 16 logs, K=3430 (SimC DBC); KYFOTG merged 2026-07-25 (was 0.073; see note at the end of this block)
  # NOT YET RATIFIED (2026-07-21, same day, next lead after the Shield Block
  # fixes above): shipping Vanguard (spec.protection_warrior.vanguard_armor_per_strength,
  # see the `specs.protection_warrior` block + constants_version 44 changelog
  # below) re-measures this corpus at RMSE 0.073, mean bias +1.8%, 16/16
  # within ±15% at this same canonical K=3430 — a large, clean improvement
  # that numerically clears 3 of the 4 `calibrated` promotion-bar gates
  # (RMSE≤0.15, |bias|≤5%, ≥75% within ±15%); LOO-CV (the 4th gate) was not
  # run. `global_rmse` above is LEFT AT 0.162 pending human ratification —
  # this comment is the pointer, not a self-certified promotion. See
  # docs/validation/protwarrior_vanguard_strength_armor_2026_07_21.md.
  # RATIFIED 2026-07-18 (was 0.068, held under review since 2026-07-17): the
  # old 0.068 figure was measured with a replay-side Demo Shout + Phalanx
  # double-count live (attacker-side debuffs re-applied on top of a
  # base_amount that already contains them — two errors partly canceling; see
  # PR #387). Post-fix, the same ratified 16-log corpus at the pinned K=3430
  # reads RMSE 0.1377 (rounds to 0.138), mean signed error +11.5% (over-
  # predict), 10/16 runs within ±15% — re-run and confirmed exactly against
  # this number 2026-07-18 (`simf calibrate-k --k-min 3430 --k-max 3430`).
  # K stays pinned at 3430 (an empirical refit to ~2905-2930 fits ~as well,
  # 0.068-0.0679, but was REJECTED on methodology — K is SimC's real DBC armor
  # constant, not a free parameter to re-fit around a mob-side bug; moving it
  # would silently absorb a named external layer and shift Guardian + every
  # other spec's shared K). See
  # docs/validation/protwarrior_demo_shout_double_count_2026_07_17.md for the
  # full measurement, methodology reasoning, and three independent
  # consistency checks. `protection_warrior`'s `calibration_tier` below is
  # downgraded `calibrated` → `characterized` in the same ratification — a
  # per-run F-factor fast-follow (measuring the separately-known mob-side
  # wedge, `docs/validation/phase4_brewmaster_physical_gap_decomposition_2026_07_04.md`)
  # should return this to ~+5% residual and likely re-earn `calibrated` with
  # cleaner attribution than it ever had.
  #
  # F-layer fast-follow measured 2026-07-21 — see
  # docs/validation/protwarrior_f_layer_measurement_2026_07_21.md. The corpus
  # IS F-consistent (median F=0.699, 15/16 within ±0.05), but the "~+5%"
  # prediction above is NEITHER confirmed nor refuted: the naive "sim × F"
  # correction it implied is invalid (measure_run_f.py's F omits this spec's
  # own Defensive Stance -15%, already inside `sim`, so multiplying double-
  # counts it — empirically flips +11.5% into -22.3%, not toward +5%). This
  # `global_rmse: 0.138` value (as it stood at the time) was UNCHANGED
  # pending a correctly-scoped per-hit-forensics wedge measurement across
  # the full corpus — since superseded by the Shield Block fixes below.
  #
  # Shield Block / block-value coupled fix measured 2026-07-21 — see
  # docs/validation/protwarrior_shield_block_fix_2026_07_21.md. With BOTH
  # real bugs fixed (calculate_armor_resist's multiplier order +
  # active_mitigation.shield_block.physical_dr's double-count deleted), the
  # SAME ratified 16-log corpus at K=3430 reads RMSE 0.250, mean signed
  # error +23.0%, 4/16 within ±15% — WORSE than the 0.138/+11.5%/10-16
  # figures above. `global_rmse: 0.138` and `calibration_tier` below were
  # (at the time this fix shipped) DELIBERATELY left unchanged (this is a
  # code-correctness fix, not a re-calibration; the two double-counting
  # bugs had been masking a larger slice of the pre-existing "structural
  # physical-mit gap," roadmap item 5) — human ratification was needed
  # before either number moved.
  #
  # Hasted Shield Block recharge fix measured 2026-07-21 — see
  # docs/validation/protwarrior_post_shield_block_bias_decomposition_2026_07_21.md.
  # `core/policy.py`'s Shield Block charge-recharge cadence was applying the
  # 16s base recharge FLAT (un-hasted); SimC source confirms it's hasted
  # (`cooldown->hasted = true;`). Fixing this closes most of the v42 gap:
  # the SAME ratified 16-log corpus at K=3430 now reads RMSE 0.162, mean
  # signed error +13.7%, 8/16 within ±15% — a large improvement over
  # 0.250/+23.0%/4-16, though still worse than the pre-v42 headline
  # (0.138/+11.5%/10-16), which was itself propped up by the v42 bugs.
  #
  # RATIFIED 2026-07-21 (same day, following human review — see the
  # matching note above the `v43` entry near the top of this file for the
  # full reasoning, promotion-bar comparison, and citation trail).
  # `global_rmse` above is updated 0.138 → 0.162 to reflect this final
  # measured state; `calibration_tier` below stays `characterized` — this
  # RMSE/bias/within-±15% state falls short of every numeric gate this
  # project uses to award `calibrated` (both the formal bar in
  # `core/constants.py` and both live historical precedents, this spec's
  # own original bar and Guardian Druid's).
  #
  # Vanguard shipped 2026-07-21 (see the unversioned note above the
  # `constants_version: 44` line) re-measured this corpus at RMSE 0.073,
  # mean bias +1.8%, 16/16 within ±15% — numerically clearing 3 of the 4
  # `calibrated` gates, but the 4th (LOO-CV) was left unrun that day and
  # `global_rmse` was deliberately left at 0.162 pending it.
  #
  # LOO-CV gate run 2026-07-22 (`simf calibrate-k` itself, newly extended
  # with the gate — PR #416 — reusing scripts/calibrate_spec_from_logs.py's
  # existing `_run_loo_cv` rather than a second implementation): **PASS**.
  # K stability max|bestK_-i − bestK_full=3250| = 180 (≤300 bar); held-out
  # prediction 16/16 (100%) within ±15% (≥75% bar); no fold beyond ±25%.
  # The tightest LOO-CV result this project has measured for any spec
  # (Guardian's two attempts: 71%/69%, both FAIL). See
  # docs/validation/protwarrior_loo_cv_vanguard_2026_07_22.md.
  #
  # RATIFIED 2026-07-22 (human decision, following the LOO-CV measurement
  # above): `global_rmse` updated 0.162 → 0.073. `calibration_tier` below
  # promoted `characterized` → `calibrated` — the first spec to clear
  # ALL FIVE sub-criteria of the promotion bar simultaneously (≥8
  # F-consistent runs: 15/16; |mean bias|≤5%: +1.8%; ≥75% within ±15%:
  # 16/16; RMSE≤0.15: 0.073; LOO-CV: PASS). Two caveats carry forward,
  # named not hidden: the cross-spec ~5-7% run-scoped wedge
  # (`docs/validation/phase4_brewmaster_physical_gap_decomposition_2026_07_04.md`)
  # is still open and unaccounted for here, and the separate ~11%
  # magic-dominated "clean wedge" residual (`scripts/full_chain_wedge.py`)
  # is untouched by Vanguard (a physical-only armor term) and remains a
  # standing lead for anyone chasing the residual further.
  #
  # DOWNGRADED calibrated -> characterized 2026-07-25 (human-ratified).
  # Applying this SAME promotion bar to 15 independent Protection Warrior
  # players (found via WCL's public characterRankings, run through the
  # identical calibrate-k machinery at K=3430) fails it: mean signed bias
  # +11.0% (bar <=5%), 67% (10/15) within +/-15% (bar >=75%), RMSE 0.150
  # (bar <=0.15, exactly at the line). Two rival explanations were checked
  # and ruled out: a spot-check of 4 independent players' WCL-hydrated
  # stats found no hydrate-quality artifact (shield_armor/crit/armor all
  # plausible, matching Brutoh's own values' order of magnitude); and the
  # gap is NOT primarily key-level-driven (even at +17-18, squarely inside
  # Brutoh's own tested +10-17 range, independent players still miss by
  # +9.3% mean while Brutoh's own corpus at the same keys sits at +1.8%).
  # The model itself is UNCHANGED (global_rmse stays 0.073, still an honest
  # description of the Brutoh-only fit) — same precedent as Guardian's
  # 2026-07-17 downgrade: this reflects a cross-validation standard the
  # tier had never actually been checked against, not a regression. See
  # docs/validation/protwarrior_calibrated_downgrade_2026_07_25.md,
  # docs/validation/protwarrior_independent_players_2026_07_25.md, and
  # docs/validation/protwarrior_independent_players_lowkey_2026_07_25.md.
  # Restoring `calibrated` needs a genuine cross-player validation pass
  # (see the new promotion criterion in core/constants.py and
  # docs/validation/protwarrior_cross_player_validation_gate_2026_07_25.md),
  # not another single-corpus LOO-CV re-run.
  #
  # KYFOTG (Keep Your Feet on the Ground) MERGED 2026-07-25, same session
  # as the cross-player gate above. Real, sourced two independent ways
  # (Wowhead tooltip + SimC source talent placement), correctly
  # window-gated on the log's own observed buff windows, not a flat
  # always-on term — see
  # docs/validation/protwarrior_magic_wedge_kyfotg_lead_2026_07_22.md for
  # the discovery and
  # docs/validation/protwarrior_kyfotg_wide_archive_2026_07_25.md for a
  # wider (37-file, 70-run, non-ratified) reconfirmation that its
  # magnitude is real, not a small-sample artifact (in/out ratio 0.916 at
  # scale vs. the tooltip's exact -8%/0.92). Re-measuring the SAME
  # ratified 16-log corpus at the SAME canonical K=3430 with KYFOTG live
  # (confirmed live 2026-07-25, `simf calibrate-k --k-min 3430 --k-max
  # 3430`): RMSE 0.073 → 0.0797 (rounds to 0.080), mean signed bias flips
  # +1.8% → −4.4% (KYFOTG's credit pushes the model from over- to
  # slightly under-predicting), within ±15% 16/16 → 14/16 (88%), LOO-CV
  # still PASSES (K stability max deviation 0, held-out prediction 14/16 =
  # 88% ≥75% bar, no fold beyond ±25%). Every one of the four same-player
  # promotion-bar numeric gates still clears (|bias|≤5%: 4.4% ✓; ≥75%
  # within ±15%: 88% ✓; RMSE≤0.15: 0.080 ✓; LOO-CV: PASS ✓) — this is a
  # real but modest widening, not a failure of the same-player bar.
  # `calibration_tier` stays `characterized` regardless, blocked ONLY by
  # the separate cross-player gate above — unaffected by this change
  # either way, since the 15-independent-player corpus that gate was
  # measured against was already run WITH KYFOTG live on this branch (see
  # the cross-player gate doc's own manifest header). The widening is NOT
  # evidence KYFOTG is wrong: the wider, non-ratified 37-file sample shows
  # its measured magnitude holds up even better at scale, not worse — the
  # ratified 16-log corpus's prior near-zero bias was partly coincidental,
  # quietly under-crediting this real gap the whole time. Merged on
  # correctness grounds (real, sourced, correctly implemented) over
  # score-preservation — the same trade already accepted for the Demo
  # Shout and Shield Block fixes before Vanguard happened to close the
  # rest of that gap. There is no guaranteed second "Vanguard" here: the
  # wide-archive doc's own resid_out finding reads as diffuse (no single
  # aura/ability correlate above noise), most likely the same cross-spec
  # "universal wedge" already named above, not a second findable passive.
  log_count: 16
  last_calibrated: "2026-05-18"
  # Per-dungeon residuals (signed % error). Positive = sim over-predicts damage;
  # negative = sim under-predicts. Absolute > 0.10 means take that dungeon's
  # verdict with extra skepticism. Populated from real M+ replay residuals.
  # Post-F1+F4+F5 sweep 2026-05-18: K=3000→4000 step 100 against 16 replays.
  # Empirical minimum at K=3200 (RMSE 0.064); we use K=3430 (SimC DBC) for
  # structural correctness — see docs/simc-reference/AUDIT.md.
  # The 230-K gap to the empirical minimum suggested ~230 of unmodelled bonus
  # armor, hypothesized (2026-05-18) to be Vanguard's strength→armor spec
  # passive. SHIPPED 2026-07-21 (`specs.protection_warrior.vanguard_armor_per_strength`)
  # — this note's own K-gap framing is now moot: Vanguard's real magnitude
  # (armor += strength × 70%, SimC-sourced) isn't a small K-offset, it
  # materially changed the corpus-wide RMSE/bias directly; see
  # docs/validation/protwarrior_vanguard_strength_armor_2026_07_21.md rather
  # than trying to reconcile this stale K=3200-era narrative with it.
  # ⚠ STALE (2026-07-18, even more so after 2026-07-21 and 2026-07-25): the
  # per-dungeon table below AND the K=3200/0.064 empirical-minimum narrative
  # above both predate the Demo Shout/Phalanx double-count fix (PR #387), the
  # 2026-07-21 Shield Block fixes, AND the 2026-07-25 KYFOTG merge — they were
  # measured under a since-fixed replay chain. Only the top-level
  # `global_rmse` above (0.080 as of the KYFOTG merge — see this block's own
  # chronological comments for the full history since 0.162) is current.
  # Re-deriving the per-dungeon breakdown and the new
  # empirical-minimum K under the fixed chain has not happened yet — this
  # stays a dedicated re-derivation task with its own test coverage, not a
  # side effect of a ratification pass (see CONTRIBUTING.md's "Known outliers"
  # line for a derived-but-not-yet-formally-published per-run shape check
  # under the current chain). Don't trust the individual dungeon numbers
  # below until that lands.
  per_dungeon:
    windrunner_spire:       +0.038   # 3 replays (+12 / +14 / +14p); -2.1%, +4.6%, +6.7%
    algeth_ar_academy:      -0.060   # 2 replays (+12 / +14); -10.8% and -7.4%; remains worst outlier (was -12.2%)
    nexus_point_xenas:      -0.007   # 1 replay (+12); -0.7% (was -5.7%)
    pit_of_saron:           +0.040   # 4 replays (+12 / +13 / +13 / +14); +5.3%, +1.8%, +2.0%, +7.0%
    skyreach:               null     # No usable replay in this sweep
    magisters_terrace:      +0.052   # 3 replays (+12 / +13 / +14); +6.7%, +3.4%, +2.8%
    maisara_caverns:        +0.020   # 2 replays (+12 / +14); +2.2%, +2.2%
    seat_of_the_triumvirate: null    # No usable replays in calibration corpus (failed runs only)
  # calibrate-k's opt-in --full-scan hardening (see
  # docs/validation/calibrate_k_corpus_manifest_2026_07_12.md). Not per-K
  # reference data like the rest of this section — just CLI-hygiene knobs
  # that shouldn't be hardcoded in Python per project convention.
  corpus_scan:
    date_drift_warn_days: 30      # warn when a scanned log's filename date is this far from the calibration character's gear snapshot
    dedup_hash_chunk_bytes: 65536 # head+tail bytes hashed for the duplicate-file content signature

armor:
  # DR = Armor / (Armor + K). What is K, and why 3430? See docs/calibration.md
  # for the plain-English explainer. Anchored to SimC's canonical DBC table:
  # `dbc->armor_mitigation_constant(level)` → 3430 at level 90 (Midnight cap).
  # Source: docs/simc-reference/expected_stat_level_90.txt (SimC commit fd60a63,
  # WoW build 12.0.5.67602).
  #
  # Previously K=2700 (a self-fit minimum across 16 Brutoh-only logs at RMSE
  # 0.068). That value absorbed missing Defensive Stance physical mitigation
  # (15% all-schools per spell data 386208, NOT applied to physical events
  # before this change) plus other small modelling errors. Empirical per-event
  # analysis on two physical-heavy logs (scripts/empirical_mitigation_analysis.py)
  # back-solved K ≈ 3116-3237 for DS=0.15 and K ≈ 3431-3569 for DS=0.20.
  # SimC's DBC value 3430 lies in the middle of that range and is character-
  # agnostic — preferred over a Brutoh-overfit value.
  #
  # Trade-off: Brutoh's RMSE expected to rise from 0.068 → ~0.075 short-term;
  # the model is now structurally correct and generalises to other tanks.
  # Recalibrate after landing to confirm actual RMSE; see docs/simc-reference/AUDIT.md.
  k_constant: 3430
  max_armor_dr: 0.85  # MAX_ARMOR_DAMAGE_REDUCTION, matches SimC engine/sc_enums.hpp:89

stat_conversion:
  # rating_per_pct: 100 across all secondaries — chosen so YAML rating values
  # equal "percent × 100" (e.g. 23.18% haste → haste_rating = 2318). This is a
  # consistent self-calibration. The absolute rating numbers won't match the
  # in-game tooltip 1:1, but sim math is identical *as long as* the result is
  # also adjusted for the Midnight stat-DR breakpoints (see secondary_dr below).
  #
  # Concretely: a self-fit rating of 4000 maps to a linear 40% pre-DR; with
  # the DR curve, the effective in-game pct is 39%. This matches what a real
  # WoW player at 4000-haste-rating-equivalent would see.
  hp_per_stamina: 22
  # REAL level-90 combat-rating conversions for the UNIFORM secondaries (12.0.7;
  # source: Maxroll stat-DR page, 2026-06-28 recalibration). Replaced the old
  # self-fit `100` anchor: rating values (in profiles AND log/WCL/paste imports) are
  # now interpreted at the real in-game scale, so the DR breakpoints below trigger at
  # the right %. Hand-authored profiles were rescaled from %×100 to real units to
  # preserve their in-game % (so the warrior K calibration is a no-op).
  #   haste 44, crit 46, versatility 54 — uniform across specs.
  versatility_rating_per_pct: 54
  haste_rating_per_pct: 44
  crit_rating_per_pct: 46
  # MASTERY rating→% is PER-SPEC and stays at 100 (NOT a uniform combat rating).
  # Ground truth (AnonGuardian1 Guardian, 2026-06-28): mastery rating 332 → 10.6% displayed,
  # and 668 → ~14% (older log) ⇒ a ~99 rating-per-1% line with ~7.2% base, i.e. ≈100.
  # So the existing per-spec 100 anchor is correct for guardian; warrior/paladin have
  # no in-game counter-evidence, and their mastery EFFECT is calibrated via the
  # separate spec coefficient (mastery_crit_block_scaling / natures_guardian_heal_coeff),
  # so leaving mastery at 100 keeps every mastery path bit-identical. Parry likewise
  # stays 100 (no ground truth; avoidance, not a gem/DR secondary).
  mastery_rating_per_pct_warrior_prot: 100
  mastery_rating_per_pct_paladin_prot: 100
  parry_per_strength: 500           # strength / 500 / 100 = parry fraction; 2182 str → 4.4% parry from strength
  # Ground truth (Brutoh, 2026-07-12, two live in-game tooltip readings):
  # "Parry of 490 adds 9.42% Parry" -> 490/9.42=52.02; "Parry of 870 adds
  # 16.73% Parry" -> 870/16.73=52.00. Both reproduce their displayed % exactly
  # at 52 (same clean-integer pattern as haste/crit/vers above). Replaces the
  # old self-fit PLACEHOLDER=100 — see
  # docs/validation/protwarrior_riposte_crit_parry_gap_2026_07_12.md.
  parry_rating_per_pct: 52
  # Base character stats at level 90 that the gear-item resolver (Wowhead/Blizzard
  # item lookup) does NOT include. A /simc paste resolved from item IDs is
  # GEAR-ONLY, but a character's real stats are gear + these base stats (+ always-on
  # buffs like Mark of the Wild + gem/enchant stats). Without them a paste-loaded
  # character had ~25% too little HP and ~half its primary stat (silently wrong
  # eHP / marginals / gem + vault verdicts). Calibrated 2026-06-28 from AnonGuardian1's
  # in-game tooltip (lvl 90 Guardian): gear stamina 17,327 + base 6,852 = 24,179
  # (→ 535k humanoid / 749k bear HP, matching the tooltip); gear agility 1,072 +
  # base 939 = 2,011. SINGLE-POINT, medium confidence (folds in always-on buffs +
  # the meta gem's primary). Stamina is class-independent; primary base is similar
  # in magnitude across classes so str/agi share paste_base_primary. Applied in
  # ui/helpers/simc_load.py ONLY on the resolver fallback (stats_estimated) path —
  # the log/WCL hydrate path already carries totals and is untouched. See
  # docs/validation/simc_paste_stat_resolution_2026_06_27.md.
  paste_base_stamina: 6852
  paste_base_primary: 939

secondary_dr:
  # Midnight 12.0.1 stat diminishing returns. Source: Maxroll
  # https://maxroll.gg/wow/resources/stat-diminishing-returns
  #
  # Each entry is (effective_pct_at_bracket_END, efficiency_in_bracket).
  # `efficiency` is the fraction of additional linear-rating that becomes
  # effective percent inside this bracket. e.g. 0.90 means every 1% linear
  # contributes 0.9% effective once you're past the prior breakpoint.
  #
  # All secondary stats (haste, crit, mastery, versatility) share the same
  # effective-percent breakpoints; only the rating-per-percent in the linear
  # regime differs per stat (which simf already self-normalises via
  # stat_conversion). Applied by character.py:apply_secondary_dr().
  #
  # Brutoh's current stats (haste 23%, crit 14%, mastery 16%, vers 3%) all
  # sit below the first 30% breakpoint, so F5 is a no-op for him today.
  # Matters for high-gear scaling (+18+) and stat-weight accuracy on stats
  # the user pushes past the soft cap.
  # Midnight 12.0.7 brackets are round LINEAR thresholds 30/40/50/60/70/200
  # (efficiency 1.0/0.9/0.8/0.7/0.6/0.5, then 0 past 200%). Stored here as the
  # EFFECTIVE % at each bracket end (what apply_secondary_dr consumes):
  #   lin30→eff30, lin40→eff39, lin50→eff47, lin60→eff54, lin70→eff60, lin200→eff125.
  # (The pre-2026-06-28 table had the classic 54-66/66-100 tail + a 113.3% cap; the
  # Midnight tail is 60/125 — only matters above ~54% effective in one stat.)
  breakpoints:
    - [0.30, 1.00]   # lin 0-30%: no penalty
    - [0.39, 0.90]   # lin 30-40%: -10%
    - [0.47, 0.80]   # lin 40-50%: -20%
    - [0.54, 0.70]   # lin 50-60%: -30%
    - [0.60, 0.60]   # lin 60-70%: -40%
    - [1.25, 0.50]   # lin 70-200%: -50%
    - [9.99, 0.00]   # past lin 200%: capped (sentinel)
  hard_cap: 1.25     # ~125% effective hard cap (at 200% linear)

base:
  dodge_chance: 0.03
  parry_chance: 0.03
  block_chance: 0.10           # Prot Warrior base block (with shield)
  crit_pct: 0.05
  mastery_pct_warrior_prot: 0.12
  # F12 (2026-05-20): block_value is now sourced from shield armor per the SimC
  # formula `block_value = shield.armor × 2.5` (engine/player/player.cpp:1681).
  # See character.py:block_value_rating() and
  # docs/validation/f12_shield_block_value_recon_2026_05_19.md.
  block_value_armor_multiplier: 2.5       # SimC: engine/player/player.cpp:1681
  # Mastery-chain coefficients — SimC sc_warrior.cpp (midnight branch):
  #   composite_block_value (line 8910)  — mastery does NOT contribute → 0.0
  #   composite_block       (line 8893)  — effectN(2).mastery_value() = 0.5
  #   block_chance roll     (line 8990)  — effectN(1).mastery_value() = 1.5
  # In-game tooltip cross-check (spell 76857 at 8% mastery): block +4%,
  # crit-block +12%, AP +8% — confirms 0.5 / 1.5 / 1.0 coefficients.
  mastery_block_value_scaling: 0.0        # F11 (2026-05-20): mastery does NOT scale block value
  mastery_block_chance_scaling: 0.5       # F13 (2026-05-20): mastery → block chance
  mastery_crit_block_scaling: 1.5         # F7 retune (2026-05-20): 1.0 → 1.5 per SimC
  # F14 (2026-05-23): block-chance diminishing returns.
  # SimC `player_t::composite_block_dr` in engine/player/player.cpp:5467:
  #   diminished = bonus / (block_factor × bonus × 100 × block_vertical_stretch + horizontal_shift)
  # Only the bonus portion (mastery + block-rating) is DR'd; the flat
  # base block (`block_chance` above) is NOT. DBC constants are class-
  # indexed (see engine/dbc/sc_extra_data.inc — `__gt_BlockFactor`,
  # `__gt_BlockVerticalStretch`, `__gt_HorizontalShift`). For the
  # Warrior class_id=1 entry — and identical for every modelled tank
  # class in the table — the values are:
  block_chance_diminishing_returns:
    block_factor: 1.0                     # __gt_BlockFactor[warrior]
    block_vertical_stretch: 0.0067        # __gt_BlockVerticalStretch[warrior]
    horizontal_shift: 1.0638297872340426  # __gt_HorizontalShift[warrior] = 1/0.94

racials:
  earthen_titan_wrought_frame: 1.10        # +10% armor from items (modeled)
  tauren_endurance_hp: 1.05                # +5% max HP (modeled)
  kul_tiran_brush_it_off_vers: 0.01        # +1% versatility (modeled)
  highmountain_tauren_dr: 0.01             # ~1% damage taken reduction (modeled — placeholder)
  dwarf_stoneform_phys_dr_active: 0.10     # 10% phys DR for 8s/120s = ~0.7% avg phys DR (modeled as average)
  dark_iron_dwarf_strength: 0.01           # situational; not modeled
  dwarven_strength: 0.01                   # situational; not modeled
  troll_regeneration_hp_pct: 0.10          # not used in sim

active_mitigation:
  shield_block:
    # REMOVED 2026-07-21 (was 0.30, uncited — see mitigation.py's step "5b"
    # removal comment + docs/validation/protwarrior_shield_block_fix_2026_07_21.md).
    # Shield Block's real Midnight 12.0.5 effect is 100% block chance only;
    # block VALUE (this constant used to double-count as a second flat cut)
    # runs through the armor curve at step 3 of mitigation.py, same as any
    # other block. Kept at 0.0 (not deleted) so any stale reference is a
    # documented no-op rather than a KeyError; nothing in the engine reads
    # this key anymore as of the same fix.
    physical_dr: 0.0
    duration_s: 6
    rage_cost: 30
    charges: 2
    recharge_s: 16
    block_chance_during: 1.0
  ignore_pain:
    rage_cost: 40
    # PATCH 12.1.0 "CURSE OF ULA'TEK" SCALAR BUMP — confirmed 2026-08-13 via
    # a real Playwright browser session against Blizzard's official patch
    # notes (https://news.blizzard.com/en-us/article/24293281/curse-of-ula-tek-content-update-notes),
    # Protection Warrior section, verbatim quote: "Ignore Pain absorb
    # amount increased by 25%." Do NOT confuse this with the separate,
    # unrelated "No Stranger to Pain" talent note in the same patch
    # ("Damage prevented by each use of Ignore Pain increased by 30% (was
    # 20%)") — that talent is not modeled by this constant.
    # 0.216 was itself the pre-12.1.0 live baseline (0.20 base x 1.08 for
    # the independent May 12 2026 +8% hotfix, unrelated to this patch);
    # the new patch's +25% applies on top of that live value:
    # 0.216 x 1.25 = 0.27.
    # This is a correctness/tooltip-accuracy update, NOT a recalibration:
    # `calibrate-k` is provably blind to this constant at any value —
    # log-replay mode (mitigation.py, event.is_log_replay branch) sources
    # absorbs from the log's own event.log_absorbed and never reads this
    # key at all. Only observable in synthetic/forward-sim output
    # (verdict, skill ladder, gear/vault recs, cooldown planner). See the
    # brutal_vitality comment below for the same point plus the empirical
    # re-run that confirmed it (byte-identical RMSE across candidate
    # values).
    absorb_pct_of_max_hp: 0.27
    cap_pct_of_max_hp: 0.30
    duration_s: 12
    # Synthetic-mode-only press gate (core/policy.py) — NOT a real ability
    # cost/cooldown, just the recent-DTPS threshold this engine presses IP
    # above when it isn't replaying a real log's actual cast timing. Moved
    # out of a hardcoded literal 2026-07-11 (talent-leftovers deep review).
    synthetic_cast_dtps_threshold: 200000
  demoralizing_shout:
    cooldown_s: 45
    duration_s: 10
    damage_taken_reduction: 0.20
    # Synthetic-mode-only press gate (core/policy.py) — see ignore_pain's
    # sibling key above. Also gates whether Unyielding Stance's DR-increase
    # ever has a Demo Shout window to apply to under a fixed sweep profile.
    synthetic_cast_dtps_threshold: 250000
    # Bosses confirmed immune to Demoralizing Shout debuff in Midnight 12.0.5.
    # Source: warcraftlogs / in-game testing. Matched against DamageEvent.source_id (attacker name).
    immune_sources:
      - "Echo of Doragosa"   # Algeth'ar Academy final boss
  shield_wall:
    cooldown_s: 240
    duration_s: 8
    damage_reduction: 0.40
  last_stand:
    cooldown_s: 180
    duration_s: 15
    max_hp_increase: 0.30
  spell_reflect:
    cooldown_s: 25
    duration_s: 5

# Phase 2.10f (2026-05-22) — skill-gate parameters for reactive abilities.
# Two channels modelled here:
#   - Spell Reflect: a Bernoulli press, one draw per incoming spell tank-
#     buster. SR is reactive — the opportunity is the event itself, not
#     a recurring CD-elapsed tick — so the "edge" is the tank-buster
#     arrival.
#   - Shield Wall + Last Stand: emergency CDs that *always* fire under
#     sustained pressure (gear can't save you from forgetting them at
#     <40% HP), but a tired / distracted tank presses them late. Modelled
#     as a reaction-lag delay sampled per HP-threshold cross. At
#     modifier=1.0 the lag is 0 (bit-identity preserved). At lower
#     modifiers the lag grows; sigma scales linearly with (1 - modifier),
#     so a "Reading the fight" tank reacts in ~0.6s mean, an "Off your
#     usual game" tank in ~1.0s mean (half-normal mean = sigma * 0.8).
#
# Sigma chosen to land Brutoh's +18 Learning death rate inside the
# 0.18-0.24 band that elite_tank predicted for the "bad night" cohort
# (validator audit, session-21 close-out 2026-05-22). Tune downward if
# the existing `test_modifier_zero_still_survives_via_emergency_cds`
# tripwire flips to 100% death rate — that's the floor.
skill_modifier_reaction_lag:
  shield_wall_sigma_at_zero_s: 2.0
  last_stand_sigma_at_zero_s: 2.0

# Adaptive-lookahead CD policy (Phase A 2026-05-23, Phase B 2026-05-23).
# When ``policy.lookahead_window_s`` > 0, the runner threads a time-
# bounded slice of upcoming damage events into every ``policy.decide()``
# call via the new ``upcoming_events`` parameter. Phase A landed the
# plumbing and one consumer (``demo_shout_precast``) gated behind the
# toggle below — default-OFF preserves bit-identity at every pinned
# seed. Setting ``lookahead_window_s`` to 0 short-circuits the slice
# allocation entirely (use it as a "skip Phase A allocations" perf
# toggle if every consumer below is also disabled).
policy:
  lookahead_window_s: 3.0

  # Phase B 2026-05-23 — first lookahead consumer. ActiveMitigationPolicy
  # gains an optional pre-cast trigger for Demoralizing Shout: if the
  # sum of physical damage scheduled within ``upcoming_window_s`` from
  # now exceeds ``upcoming_physical_threshold``, fire DS pre-emptively
  # instead of waiting for ``recent_dtps > 250_000`` (the past-burst
  # gate). Encodes the canonical Prot Warrior coaching tip — "pre-cast
  # Demo Shout one GCD before a tank-buster" — that the skill_tiers
  # `focus` callout already names. Default ``enabled: false`` to keep
  # bit-identity at every pinned seed; only synthetic-sim runs see a
  # behaviour delta when this is flipped on, because replay mode fires
  # DS unconditionally via the existing ``is_replay_event`` clause.
  # Threshold = 250_000 (the past-burst DTPS gate) × 1.5s window = 375_000
  # — symmetric to the existing past-burst gate. Tune window/threshold
  # in lockstep if recalibrating.
  lookahead_consumers:
    demo_shout_precast:
      enabled: false
      upcoming_window_s: 1.5
      upcoming_physical_threshold: 375000.0

talents:
  # Armor-multiplier talents for Prot Warrior (modelled in Character.total_armor()).
  # Source: SimC sc_warrior.cpp composite_armor_multiplier() — both stack as
  # separate `ar *= 1 + X%` multipliers (multiplicative across, not additive).
  # See docs/simc-reference/AUDIT.md F8 + docs/validation/nexus_12_wowhead_talents_2026_05_18.md.
  reinforced_plates:
    armor_multiplier: 0.05      # +5% armor (class talent, spell 382939 effect 2, subtype 101 "Modify Armor%")
    spell_id: 382939
  armor_specialization:
    armor_multiplier: 0.06      # +6% armor (Prot spec talent, spell 1234769 effect 1, subtype 101)
    spell_id: 1234769
  # NOTE (superseded 2026-07-21): Vanguard is NOT a talent — it's a Prot
  # Warrior SPEC PASSIVE (find_specialization_spell, always active), so it
  # was never listed as a talent entry here and doesn't belong in this
  # block. This comment used to claim "spell data effect value is 40%"
  # against an empirical "~0.258" fit and left both unresolved/default-OFF —
  # both numbers were wrong: 40% was Vanguard's unrelated Stamina effect
  # (Effect #2), not its armor effect (Effect #1, actually 70%, confirmed by
  # live Wowhead tooltip + SimC source agreeing), and 0.258 was fit under a
  # replay chain with 3 mitigation bugs that got fixed later the same day as
  # this note's removal. Real coefficient now shipped, unconditional (no
  # toggle — every Protection Warrior has this passive) as
  # `specs.protection_warrior.vanguard_armor_per_strength: 0.70`, consumed by
  # `Character.total_armor()`. See
  # docs/validation/protwarrior_vanguard_strength_armor_2026_07_21.md.
  indomitable:
    damage_reduction: 0.04
    max_hp_increase: 0.04
  battle_scarred_veteran:
    trigger_hp_pct: 0.30
    damage_reduction: 0.30
    duration_s: 6
    internal_cd_s: 60.0    # ICD prevents consecutive procs when HP stays low
  brutal_vitality:
    # PATCH 12.1.0 "CURSE OF ULA'TEK" SCALAR BUMP — confirmed 2026-08-13 via
    # a real Playwright browser session against Blizzard's official patch
    # notes (https://news.blizzard.com/en-us/article/24293281/curse-of-ula-tek-content-update-notes),
    # Protection Warrior section, verbatim quote: "Brutal Vitality adds 10%
    # of damage dealt to Ignore Pain (was 8%)."
    #
    # The value below (0.10) is the real live tooltip number, not a scaled
    # version of the prior 0.05. The prior comment on this constant claimed
    # it was a "PLACEHOLDER — calibrated down to match log replay", but a
    # 2026-08-13 audit (`git log -S pct_of_damage_dealt_to_ip_absorb --
    # src/simf/data/constants.yaml`) found that claim had NO backing: only
    # the repo's initial commit ever touched this key — there was never a
    # real fitting event behind the "calibrated down" language. The
    # project owner was told this explicitly and chose to trust the real
    # tooltip value instead of preserving an unverifiable fudge factor,
    # especially since the missing `cap_pct_of_max_hp` self-cap below
    # (previously absent — see policy.py's clamp logic) removes the likely
    # original motivation for fudging the rate down.
    #
    # This is a correctness/tooltip-accuracy update, NOT a recalibration:
    # `calibrate-k` is provably blind to both constants in this block at
    # ANY value. Log-replay mode (mitigation.py, the `event.is_log_replay`
    # branch) routes absorbs through the log's own
    # `event.log_absorbed` field, completely bypassing the modeled Ignore
    # Pain/Brutal Vitality chain in policy.py — the ratified 16-log
    # calibration corpus runs entirely in replay mode. Verified empirically
    # 2026-08-13: temporarily setting these constants to candidate values
    # and re-running `calibrate-k` against the ratified corpus produced a
    # byte-identical RMSE=0.0792 and LOO-CV result before reverting. These
    # constants are only observable in synthetic/live forward-sim output
    # (verdict, skill ladder, gear/vault recommendations, cooldown
    # planner) — `calibration_tier` must not move either direction from
    # this fix.
    pct_of_damage_dealt_to_ip_absorb: 0.10
    # Brutal Vitality's OWN self-cap on what it specifically contributes to
    # the Ignore Pain shield — separate from and in addition to the shared
    # `ignore_pain.cap_pct_of_max_hp` (0.30) cap on the whole shield. Live
    # tooltip text: "up to 15% of max health." Blizzard's 12.1.0 patch
    # notes (cited above) say nothing about this self-cap changing, and
    # the notes are precise enough elsewhere (e.g. they DO call out the
    # 8%->10% damage-conversion rate change in the same ability) that a
    # silent change here would be surprising — treated as unchanged.
    # Previously missing entirely: policy.py only enforced the shared 30%
    # cap on the whole shield, never this separate 15% self-limit on BV's
    # own cumulative contribution (fixed alongside this scalar update —
    # see MitigationState.brutal_vitality_absorb).
    cap_pct_of_max_hp: 0.15
  brace_for_impact:
    shield_slam_stack_dr: 0.01
    max_stacks: 4
  thunderlord:
    demo_shout_cdr_per_thunder_clap_s: 1.0
    enemies_affected_increase: 5
  enduring_defenses:
    shield_wall_cdr_pct: 0.30
  unyielding_stance:
    # Spell 1235047. DBC: A_ADD_FLAT_MODIFIER / SPELLMOD op 3 ("Modifies
    # Effect #1's Value"), value -4 — a flat modifier to Defensive Stance's
    # OWN Effect 1 magnitude (-15 -> -19 at live), not a separate aura, so it
    # folds ADDITIVELY into defensive_stance_dr in mitigation.py — unlike
    # fight_through_flames below, which activates a different effect slot
    # (Effect 3) and correctly composes as its own multiplicative layer.
    # Previously miscoded as a Demoralizing Shout DR bump (a different
    # ability entirely) at the wrong value (0.05).
    # 0.04 is the LIVE value — confirmed by both the DBC effect value above
    # AND WoW patch 12.1.0's own patch notes ("Unyielding increases the
    # damage reduction bonus of Defensive Stance by 6% (was 4%)") — do not
    # bump to 0.06 before 12.1.0 ships (~Aug 11 2026); see the patch's
    # readiness plan for the scalar-bump PR.
    defensive_stance_dr_increase: 0.04
  anger_management:
    rage_per_cd_s: 10   # 10 rage spent reduces Shield Block charge CD by 1s
  fight_through_flames:
    # Prot Warrior magic-DR talent (spell 452494). Activates Defensive Stance
    # buff Effect 3 to a non-zero value — −6% magic damage taken (school mask
    # 126 = magic schools). Composes multiplicatively on top of DS Effect 1
    # (−15% all-schools). May 12 2026 hotfix buffed 4% → 6%. Source: docs/
    # simc-reference/AUDIT.md F4 + Icy Veins tank tuning hotfixes May 12.
    # NOT in brutoh-actual loadout — modelled here for users who pick FtF.
    magic_dr: 0.06
    spell_id: 452494
  phalanx:
    damage_taken_debuff_on_target: 0.08    # buffed 5% → 8% in May 12 2026 hotfix
    duration_s: 8
    avg_uptime: 0.50    # TC applies debuff, SS consumes it; ~50% real uptime in M+ single-target
    # Bosses confirmed immune to the Phalanx Mark debuff in Midnight 12.0.5.
    # Phalanx is a *target debuff* — a boss flagged immune to negative effects
    # never receives the mark, so the player gets no DR from that source.
    # Matched against DamageEvent.source_id (attacker name).
    # Empirically the DS-immune set is also Phalanx-immune in M+ — see
    # dungeons.yaml algethar note (-9% → -16.8% gap when Phalanx wrongly
    # credits Echo of Doragosa). Keep this list parallel to demoralizing_shout.immune_sources
    # but separate: a future boss could be immune to one and not the other.
    immune_sources:
      - "Echo of Doragosa"   # Algeth'ar Academy final boss

skill_tiers:
  # Phase 2.10 — Skill-Adjusted Verdict. The single-number verdict implicitly
  # assumes optimal play; this block defines a ladder so the player can see how
  # the answer changes with playstyle. Each tier carries:
  #   - id        — stable key (don't rename without bumping constants_version)
  #   - label     — growth-framed, encouraging — what you DO at this tier,
  #                 not a judgement on the player
  #   - modifier  — Bernoulli probability that an opportunistic press
  #                 (Shield Block / Demoralizing Shout) fires when the
  #                 optimal policy would have pressed. Emergency CDs
  #                 (Shield Wall / Last Stand) and reactive (Spell Reflect)
  #                 are unaffected — nobody at +14 forgets Shield Wall at
  #                 25% HP. RNG is separate from the iteration RNG so
  #                 modifier=1.0 is bit-identical to pre-v13.
  #   - focus     — the one habit to build to move up a tier. Generic in
  #                 v1; v2 anchors it to specific moments in the player's
  #                 logs ("at 4:21 in the Gemellus run-up, SB was idle 11s").
  #   - min_sb_uptime — lower bound on Shield Block uptime % for this
  #                 tier when inferring playstyle from a real log
  #                 (v2.10b). Player's measured uptime → first tier whose
  #                 `min_sb_uptime` they meet or exceed. Top-down match,
  #                 so a 90% uptime player buckets as `in_the_zone`.
  #   - min_ds_press_rate — lower bound on Demoralizing Shout press rate
  #                 (actual_casts / theoretical_max_casts at the base
  #                 45s CD, capped at 1.0) for the same tier (v3,
  #                 2026-05-21). Combined tier = min(sb_tier, ds_tier)
  #                 per YAML ordering, so a player must clear both
  #                 thresholds to claim a tier. Mirrors the engine's
  #                 `_skill_allows_press()` gate — that Bernoulli draw
  #                 applies to both spells equally, so the inference
  #                 should too. Thresholds are initial heuristics —
  #                 refine once we have a multi-player log corpus
  #                 (Phase 6.5).
  # Modifiers are initial guesses; refine against logs once we land
  # log-based tier inference. Order matters: top tier first.
  - id: in_the_zone
    label: "In the zone"
    modifier: 1.00
    min_sb_uptime: 0.75
    min_ds_press_rate: 0.75
    description: "Optimal play — pressing every button on cooldown."
    focus: "Skill cap reached on the buttons. Gear and talents are your next bottleneck."
  - id: anticipating
    label: "Anticipating the spike"
    modifier: 0.85
    min_sb_uptime: 0.50
    min_ds_press_rate: 0.50
    description: "Predictive presses, occasional missed timing."
    focus: "Stack Shield Wall with Last Stand on the same lethal hit instead of spacing them."
  - id: reading
    label: "Reading the fight"
    modifier: 0.65
    min_sb_uptime: 0.25
    min_ds_press_rate: 0.25
    description: "Reactive use — press after seeing the damage, not before."
    focus: "Pre-cast Demoralizing Shout one GCD before a tank-buster lands, not after."
  - id: learning
    label: "Learning the buttons"
    modifier: 0.40
    min_sb_uptime: 0.0
    min_ds_press_rate: 0.0
    description: "Inconsistent presses, frequent charge cap."
    focus: "Press Shield Block on cooldown during physical trash — don't save it for bosses."
    # High-key relabel (2026-05-22). At +15+ a "Learning the buttons"
    # tank doesn't exist as a population — they got filtered by the
    # +14-17 progression gate. The modifier=0.40 cohort at +18 is an
    # experienced tank having a degraded night (post-raid, on an alt,
    # learning a new dungeon's cadence). Wording from brutoh + elite_tank
    # multi-agent review 2026-05-22.
    high_key_min_level: 15
    high_key_label: "Off your usual game"
    high_key_description: "Late presses on a tired night."
    high_key_focus: "Cycle Shield Block back in on the next pull — one full cycle catches you up fast."

survivability_recommender:
  # Conversion factor used by the per-slot recommender's composite scorer.
  # ΔDPS values from `dps_stat_weights` are in the order of single digits per
  # swap; ΔeHP is in the hundreds-to-thousands. Multiplying ΔDPS by this
  # constant puts both axes in the same magnitude band so the 0-100% slider's
  # extremes feel symmetric. Tune downward if DPS picks dominate too easily.
  dps_to_ehp_ratio: 1000.0
  # Meaningful-upgrade gate (2026-06-30). A slot is only flagged as a swap on the
  # default paperdoll when its survival gain clears this fraction of the
  # character's baseline eHP — otherwise any +1 eHP vers re-shuffle lit up ~14/16
  # slots ("good for max-vers, not super helpful" — user). Below the bar a slot
  # reads a quiet "Best you own"; the FULL max-vers sweep stays reachable via the
  # per-slot Browse control + the upgrade panel (those are NOT gated). 0.005 =
  # 0.5% of eHP, matching AskMrRobot's 0.5% Best-in-Bags default; Raidbots treats
  # sub-margin swaps as "sidegrades" and keeps the equipped item. Set 0 to disable.
  meaningful_upgrade_ehp_pct: 0.005

dps_stat_weights:
  # Relative DPS value per 1000 secondary rating for Prot Warrior (Midnight 12.0.5).
  # Used to show the survivability/DPS tradeoff in `simf stat-weights` and to
  # break ties between similar-eHP gear picks in the slot-dialog scorer.
  #
  # ORDERING refit 2026-05-23 against Method's Midnight 12.0.5 DPS priority —
  # https://www.method.gg/guides/protection-warrior/stats-races-and-consumables
  # which reads "Strength >> Haste > Crit = Vers > Mastery for all situations."
  # Pre-this-refit YAML had `mastery (1.05) > vers (0.80)`, which directly
  # contradicted Method's "mastery last, vers tied for 2nd" — every slot-dialog
  # tie that came down to a mastery-vs-vers swap rendered the wrong winner.
  #
  # Bloodmallet's per-distribution chart is the canonical numerical source but
  # its pages JS-render and don't survive a WebFetch from the Pi (same failure
  # mode as Wowhead per-dungeon loot pages — see midnight_loot_data_refs.md).
  # The magnitudes below stay PLACEHOLDER until a Bloodmallet JSON endpoint
  # exists or a Brutoh-specific Raidbots stat-weight sim lands; the ordering
  # is now correct against the authoritative qualitative source.
  #
  # Normalization: kept on the same scale as the pre-refit YAML so any UI
  # consumer that hard-codes a max ≈ 1.4 is unaffected. Only the relative
  # ranking moved.
  haste_rating: 1.40        # #1 — Method ranks Haste strictly above the Crit/Vers tier
  crit_rating: 1.10         # #2 (tied with vers) — Crit = Vers per Method
  versatility_rating: 1.05  # #2 (tied with crit) — bumped from 0.80; flat % damage + survivability side-benefit
  mastery_rating: 0.80      # #4 — Method ranks Mastery LAST; was 1.05 (incorrectly above vers)

