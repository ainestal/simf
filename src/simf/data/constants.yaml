    # ratified corpus at canonical K=3430: RMSE 0.162→0.073, mean bias
    # +13.7%→+1.8%, 8/16→16/16 within ±15% (0.068 excluding 2
    # partial/truncated runs) — numerically clears 3 of the 4 `calibrated`
    # gates (RMSE≤0.15, |bias|≤5%, ≥75% within ±15%); LOO-CV not run this
