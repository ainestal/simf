    # Ironfur (192081): bonus armor = X% of Agility per stack, added to the
    # already-Bear-Form-multiplied pool. SimC druid_t::composite_armor() does
    # `a = player_t::composite_armor(); a += if_val * cache.agility()` — the
    # Ironfur term is added OUTSIDE composite_armor_multiplier, so there is NO
    # extra ~1.30 pool multiplier to model (an earlier hypothesis, REFUTED from
    # the SimC midnight source). simf's `gear×3.2 + agi×coeff×stacks` is the
    # SimC-faithful shape. Live 12.0.x base = 124% of Agility/stack (112% was the
    # stale 11.0.2 value). The coeff below is the EFFECTIVE per-stack for a
    # typical M+ Killing-Strikes build (124% base × Killing Strikes +20% ≈ 1.49),
    # data-anchored to AnonGuardian1's 16-run COMBATANT_INFO armor ladder (per-stack
    # ≈2,800 ≈ 1.4×agi at his agi, R²=0.99) + the live ~11k in-form anchor, and
    # validated 13/16 runs within ±15% (mean |Δ| 9.2%). NOT universal — a
    # no-Killing-Strikes build is ~1.24; per-talent gating (cf. the Brewmaster
    # mitigation ledger) is the named follow-up. See
    # docs/validation/phase4_guardian_local_logs_2026_06_24.md.
    ironfur_flat_armor_per_agility_per_stack: 1.46
    # Avg effective Ironfur stacks in M+. Measured 2.45 (range 2.18–2.69, rising
    # with key) across AnonGuardian1's 16 timed +10..+16 local runs — Ironfur is
    # RAGE-CAPPED (2–9× more "Not enough rage" fails than casts), not GCD-capped,
    # so this is the rage-economy average, well below the raw 8-stack ceiling.
    # This is the haste model's REFERENCE stacks (at ironfur_haste_model.ref_haste_pct);
    # for a non-Elune's-Chosen Guardian it is used flat (haste-independent).
    ironfur_avg_stacks_m_plus: 2.45
    ironfur_stacks_max: 8            # raw Ironfur stack ceiling — the haste model true-clamps to this
    # Haste→rage→Ironfur uptime-elasticity (Phase: Guardian model finish, 2026-06-24).
    # Consumed by Character._guardian_ironfur_avg_stacks(): stacks scale with haste
    # because Ironfur is hard rage-capped in M+ and ~94% of Guardian rage is
    # haste-scaled (auto + DoT-tick + haste-reduced-CD sources; there is NO
    # rage-from-damage-taken in 12.0.x — verified vs SimC + the 16-run energize
    # breakdown). stacks = ironfur_avg_stacks_m_plus × (1 + k·(haste% − ref)/ref),
    # true-clamped to [0, ironfur_stacks_max].
    #   k = 0.75 = haste-scaled-rage-fraction (0.945, mechanistic ceiling; band
    #       0.85–0.97) × concave rage→stacks transmission (~0.8, since the
    #       fail:cast ratio softens as rage rises). RATIFIED conservative central
    #       value 2026-06-24 (user is an expert Guardian) — NOT the raw 0.945.
    #   ref_haste_pct = 0.275 = AnonGuardian1's MEASURED 16-run mean haste_pct at the REAL
    #       12.0.7 conversion (haste 44 rating/pct; <0.30 breakpoint so pre/post-DR
    #       identical). At ref the elasticity factor is exactly 1.0 → a NO-OP at the
    #       P1 corpus. RE-EXPRESSED 2026-06-29: was 0.121 under the old self-fit
    #       100-rating/pct conversion; the #214 recal (haste 100→44, 2026-06-28)
    #       changed the units but left ref stale, so the elasticity read ~2.3× the
    #       real haste deviation and over-stacked Ironfur (4.87 vs live ~2.45 →
    #       ~20% over-mitigation). 0.121 × 100/44 = 0.275 restores the no-op anchor.
    #   detect_buff_spell_id = 202770 Fury of Elune — an Elune's Chosen capstone
    #       BUFF (Druid of the Claw lacks it), gated like the Brewmaster ledger.
    # HONESTY: k is UN-REGRESSABLE (AnonGuardian1's haste is gear-locked) and SINGLE-BUILD
    # (~22% of his rage is EC Moonfire-engine a DotC build doesn't have). So this
    # is a MODELED, single-profile haste survival value — calibrated STAYS false,
    # and the UI must caption it "modeled / un-regressed / Elune's Chosen only".
    # A non-Elune's-Chosen or unknown build gets NO haste scaling (static 2.45,
    # haste marginal 0). Promote toward calibrated only after a 2nd Guardian
    # profile at a MATERIALLY different haste% (or a DotC log) confirms the slope.
    # See docs/validation/phase4_guardian_haste_model_2026_06_24.md.
    ironfur_haste_model:
      detect_buff_spell_id: 202770
      k: 0.75
      ref_haste_pct: 0.275
    ironfur_duration_s: 7.0
    # Baseline flat all-school DR — the Defensive-Stance / Demonic-Wards analog
    # the Guardian path previously lacked entirely. Thick Hide (16931, -4% all)
    # × Bear Form passive (5487, -3% all) ≈ -6.9%. Consumed by Character._always_on_dr.
    thick_hide_dr: 0.04
    bear_form_passive_dr: 0.03
    # Magic-school DR the Guardian path omitted until 2026-06-29. VALIDATED against
    # 11 gear-certain WCL logs: the sim under-mitigated EVERY magic school by a
    # near-uniform ~15pp (real magic mit ~38% vs sim ~22%), over-predicting damage
    # in magic-heavy content (Nexus-Point Xenas +21/+33%). Two sourced layers, both
    # baseline-on (ratified 2026-06-29 — WCL COMBATANT_INFO carries no talent data
    # to gate on; the uniform gap across all 11 logs shows they run these). See
    # docs/validation/phase4_guardian_wcl_validation_2026_06_28.md.
    #   Ursol's Warding (471492): magic DR modeled as 10% of the tank's ARMOR DR
    #     (~8.5% for a geared bear), all non-physical schools. PROVENANCE (corrected
    #     2026-06-30 audit): spell-data-derived, NOT from the SimC code path — SimC
    #     marks Ursol's Warding `// TODO: NYI` (sc_druid.cpp:1115/11269; declared,
    #     never implemented in target_mitigation), so the 10%-of-armor formula is
    #     UNVALIDATED against SimC's model. Magnitude/formula medium-confidence;
    #     do not "tune" it to chase the magic residual (that residual is execution —
    #     see docs/validation/phase4_guardian_magic_mit_2026_06_29.md, 2026-06-30).
    ursols_warding_magic_dr_pct_of_armor: 0.10
    #   Bear Form (5487 Effect #14): EXTRA -6% ARCANE, on top of the all-school
    #     bear_form_passive_dr. SimC source (sc_druid.cpp:14603-14613): this is the
    #     arcane half of GLISTENING FUR (Elune's-Chosen hero talent), gated on
    #     `talent.glistening_fur.ok()` — NOT a baseline Bear Form effect. We apply it
    #     baseline-on (unconditional) as an Elune's-Chosen meta-default, which
    #     OVER-CREDITS a non-Glistening-Fur / Druid-of-the-Claw bear by 6% arcane.
    #     KNOWN GAP (2026-06-30 docs-only decision, validator-audited): the SIBLING
    #     effect #13 (-3% to all NON-arcane magic — shadow/fire/frost/nature/holy) is
    #     deliberately NOT modeled. Adding it would close ~2.6pp of the ~8.4pp shadow
    #     over-prediction; the remaining ~5.8pp is reactive-CD-timing execution, not a
    #     constant. Effect-#13/#14 magnitudes are Wowhead/DBC-sourced (medium-confidence;
    #     the .cpp reads them from DBC). See phase4_guardian_magic_mit_2026_06_29.md.
    bear_form_arcane_dr: 0.06
    # Party-aura DR (healer + party magic auras) — parity with the warrior path.
    # Replay opt-in (state.party_magic_dr_active); `all` applies to every event,
    # `magic` stacks on non-physical. Mirrors protection_warrior's values.
    party_dr_by_school:
      all: 0.05
      magic: 0.00
    # Barkskin: 20% DR for 8s on 60s CD → ~2.7% average effective DR
    barkskin_dr: 0.20
    barkskin_duration_s: 8.0
    barkskin_cooldown_s: 60.0
    barkskin_avg_dr: 0.027
    # Survival Instincts: emergency 50% DR. Live 12.0.7: 180s CD, 2 charges baseline
    # (verified 2026-06-29). The 2nd charge is unmodeled — SI is emergency-triggered
    # here, low-stakes; revisit if SI spike-coverage matters for the coaching surface.
    survival_instincts_dr: 0.50
    survival_instincts_duration_s: 6.0
    survival_instincts_cooldown_s: 180.0
    # NOTE: Rage of the Sleeper was REMOVED in patch 12.0.0 (verified 2026-06-29 vs
    # SimC source + Warcraft Wiki "12.0.0: Removed"). The prior ~3.3% all-school
    # baseline DR (rage_of_the_sleeper_dr/avg_dr) was a phantom layer crediting a
    # deleted ability for every Guardian, and even mis-valued (25% vs the old real
    # 20%). Removed from the chain — do not re-add without re-verifying it exists.
    # Tooth and Claw: passive — every Mangle has a 35% chance to grant a
    # 2-stack debuff making your next 2 attacks heal you for ~6% max HP.
    # Modeled as a periodic 6% max-HP heal at the proc rate.
    tooth_and_claw_heal_pct_max_hp: 0.06
    tooth_and_claw_procs_per_minute: 12.0
    # Mastery: Nature's Guardian (155783) — two always-on auras. SimC realizes
    # BOTH as the FULL mastery_value (coeff 1.0, NOT 0.7) — see sc_druid.cpp
    # (midnight) line 13122 max-HP `resources.max *= 1 + cache.mastery_value()`
    # and lines 12463-12492 healing:
    #   (1) Mod Increase Max Health %  — +mastery to max HP. DELIBERATELY NOT
    #       modeled as an explicit max_hp() term: simf's stamina→HP conversion
    #       (hp_per_stamina=22, vs WoW's real ~20) already reproduces the in-game
    #       SHEET HP, which is always-on-NG-inclusive. AnonGuardian1 log-path 770,962 vs
    #       observed bear 782,078 = +1.4% with NO term; an explicit ×(1+mastery)
    #       would DOUBLE-COUNT. The 22-vs-20 gap already absorbs NG's max-HP aura.
    #   (2) Mod Healing/Absorb Taken %  — scales ALL non-percent healing & absorbs
    #       RECEIVED. SimC implements it as spell 227034 ("Nature's Guardian"), a
    #       proc that fires on every non-pct heal received and heals for
    #       `received_heal × mastery_value`. So 227034 in a combat log IS this
    #       mastery aura realized as discrete heal events — it is NOT a separate
    #       ability and must NOT be modeled as an extra self-heal stream (that
    #       double-counts mastery). simf models the same effect as a multiplier via
    #       Character.incoming_healing_multiplier(), consumed in runner.py (healer
    #       HPS, externals, reactive bursts) + guardian_druid.py (Tooth & Claw).
    #       NOTE the proc EXCLUDES percent-of-max-HP heals (sc_druid.cpp:12480), so
    #       Frenzied Regeneration (a %-max-HP heal) is mastery-NEUTRAL — see the
    #       frenzied_regeneration block below; it is intentionally NOT multiplied.
    # COEFF RECALIBRATED 0.70 → 1.0 (2026-06-27, constants_version 29). SimC heals
    # 227034 for `received_heal × cache.mastery_value()` (coeff 1.0, NOT 0.7 — the
    # 0.7 Wowhead "SP mod" is the per-mastery-POINT value already baked into the
    # displayed mastery %, so applying it again on top double-counted). The true
    # coefficient is mastery_value itself ≈ 0.147 at AnonGuardian1's 668 rating, confirmed
    # THREE ways: (1) simf's own mastery_pct(668)=0.1468; (2) a dual-validator
    # proc-pairing measurement on the logs (227034_raw / trigger_raw ≈ 0.13–0.14);
    # (3) SimC's max-HP aura uses the same full mastery_value. So
    # incoming_healing_multiplier(668) = 1 + 1.0 × 0.1468 = 1.147 (was 1.103).
    #
    # DO NOT use the whole-fight EFFECTIVE ratio 227034_eff/other_eff ≈ 0.226
    # (×1.226) as the multiplier — it is inflated by differential overheal (the
    # efficient ~95% proc vs ~50%-overhealing healer streams). simf applies this
    # multiplier to the OFFERED baseline_hps (runner.py) which is then clamped to
    # missing HP; survival is decided in low-HP windows where overheal→0 so
    # effective≈raw. Using 0.226 would over-credit healing ~7% in exactly those
    # windows (dual-validator log-replay finding, 2026-06-27).
    #
    # LEVEL log-grounded (raw mastery_value ~0.147 + SimC coeff 1.0); SLOPE
    # single-gear-underdetermined (one mastery point) → calibrated stays false.
    # Kept in simf's normalized mastery space (rating_per_pct=100) so cross-stat
    # gem/weight comparisons stay consistent and K-calibration is untouched. See
    # docs/validation/phase4_guardian_self_heal_mastery_2026_06_27.md (and
    # phase4_guardian_mastery_hp_2026_06_25.md for the original lever).
    natures_guardian_heal_coeff: 1.0
    base_mastery_pct: 0.08
    mastery_rating_per_pct_guardian: 100
    # Frenzied Regeneration (22842) — reactive self-heal. Modern (8.0.1+) FrR is a
    # FLAT % of max HP over 3s (NOT the pre-8.0 "% of recent damage taken"); Icy
    # Veins 12.0.7 lists ~20% max HP, 4 ticks. Innate Resolve (near-mandatory M+
    # talent, in AnonGuardian1's build) adds a 2nd charge and scales the heal up to +120%
    # the lower your health. Modeled in GuardianPolicy.decide as a single effective
    # heal per press, clamped to missing HP, gated on hp_pct + charges/recharge.
    # MASTERY-NEUTRAL: FrR is a %-max-HP heal, which the 227034 mastery proc
    # excludes (sc_druid.cpp:12480), so it is NOT multiplied by
    # incoming_healing_multiplier(). Magnitudes MEDIUM confidence (single build,
    # un-regressable) → calibrated stays false. recharge_s patch-uncertain (24-36s).
    frenzied_regeneration:
      base_pct_max_hp: 0.20            # ~20% max HP per press (Icy Veins 12.0.7)
      innate_resolve_low_hp_bonus: 1.2 # ×(1 + 1.2×(1−hp_pct)) — stronger when low
      trigger_hp_pct: 0.50             # press when hp ≤ 50% and a charge is up
      charges: 2                       # base 1 + Innate Resolve
      recharge_s: 24.0                 # per-charge recharge (patch-uncertain)
    # Incarnation: Guardian of Ursoc — full Bear form duration; +30% max
    # HP + 30% armor for 30s on 180s CD. Treated as a Last-Stand pattern.
    incarnation_max_hp_increase: 0.30
    incarnation_armor_multiplier: 1.30
    incarnation_duration_s: 30.0
    incarnation_cooldown_s: 180.0
    # Agility → dodge scaling (Guardian uniqueness)
    agility_per_dodge_pct: 1000.0    # 1000 agi → +1% dodge (PLACEHOLDER)
    base_dodge_chance: 0.05          # higher Guardian baseline

  blood_death_knight:
    # First characterized 2026-07-04 against 5 public Midnight (zone-47) WCL
    # M+ fights (4 players, 5 dungeons, keys +20..+22) — see
    # docs/validation/phase4_blood_dk_characterization_2026_07_03.md.
    # Global K=3430 applies (the armor curve is class-agnostic at level 90).
    # Bone Shield + Rune Carved Plates values are pinned to SimC (midnight
    # branch) + Wowhead DBC, NOT fitted. `characterized` (2026-07-03 5-log
    # pass, 4/5 within +/-15%, RMSE 0.152 — closest untouched spec to the
    # calibrated tier, blocked on a second hero-talent build); UI surfaces
    # the amber "uncalibrated spec" warning below the top tier.
    calibration_tier: characterized
    # Bone Shield (spell 195181, SimC midnight composite_bonus_armor):
    # bonus armor = 180% of Strength while >=1 charge — the armor is
    # INDEPENDENT of the stack count (SimC parses the buff IGNORE_STACKS;
    # stacks are charges consumed by auto-attacks, not intensity). The old
    # flat 3%/stack physical DR was a placeholder mechanism that does not
    # exist in Midnight. Measured on the 5-fight corpus: >=1-charge uptime
    # 97.4-99.9% wall-clock, 99.6-100% damage-weighted; avg ~10 stacks.
    # Replay gates on the log's real buff windows; the synthetic sim treats
    # it as always-on (the rotational refresh keeps it up, and the measured
    # uptime supports that).
    bone_shield_armor_from_strength: 1.80  # Wowhead 195181 effect#1 "Mod Armor From Stat %: 180%"
    bone_shield_spell_id: 195181
    # Death Strike: heals max(7% max HP, 25% of damage taken in last 5s).
    # The 5s recent_damage_window is already tracked on MitigationState.
    # Cast rate scales with rune regen + runic power generation; modeled as
    # a periodic policy tick during low-HP windows.
    death_strike_heal_pct_of_recent_dmg: 0.25
    death_strike_min_heal_pct_of_max_hp: 0.07
    death_strike_runic_power_cost: 45.0
    death_strike_avg_per_minute: 8.0  # ~8 DS per min in active M+ pace
    # Vampiric Blood: +35% max HP, +30% healing for 10s on 90s CD. Reuses
    # the shield_wall slot pattern; max HP boost handled via Last Stand
    # mechanism (temporary max_hp inflation that contributes to survival).
    vampiric_blood_max_hp_increase: 0.30   # Midnight 12.0.5 (was +35% pre-tuning)
    vampiric_blood_healing_increase: 0.30
    vampiric_blood_duration_s: 10.0
    vampiric_blood_cooldown_s: 90.0
    # Icebound Fortitude: 30% all-school DR for 8s on a 120s CD (Wowhead
    # spell 48792, live Midnight 12.0.5: "Mod % Damage Taken ... -30%",
    # duration 8s, cooldown "2 minutes"; matches the coaching-registry
    # cooldown_s: 120 above — the old 180 contradicted it). Emergency CD slot.
    icebound_fortitude_dr: 0.30
    icebound_fortitude_duration_s: 8.0
    icebound_fortitude_cooldown_s: 120.0
    # Rune Carved Plates (Deathbringer hero talent 440282; buffs 440289
    # physical / 440290 magical): each Rune GENERATED grants a stack of the
    # physical buff, each Rune SPENT a stack of the magical buff — 1.5% less
    # damage of that type per stack, max 5, 5s (SimC midnight resource_gain/
    # resource_loss + buff default_value effectN(1)/1000; warcraft.wiki +
    # 11.0.5 patch note "1.5% per stack (was 2%)"). Replay-only, gated on the
    # buff windows observed in the log (a San'layn build has no RCP auras and
    # gets no credit — the honest failure mode). active_buffs carries
    # presence, not stack count, so the model credits per_stack x the
    # damage-weighted average stacks measured while the buff is up:
    # 2.9-3.8 across all 10 (fight x school) measurements on the 5-fight
    # corpus -> 3.5. All 5 corpus tanks are Deathbringer (the M+ meta).
    rune_carved_plates_physical_spell_id: 440289
    rune_carved_plates_magical_spell_id: 440290
    rune_carved_plates_dr_per_stack: 0.015
    rune_carved_plates_avg_stacks_while_up: 3.5
    # Blood-Soaked Ground (San'layn hero talent 434033; buff 434034): while
    # standing in your own Death and Decay, physical damage taken is
    # reduced by a flat 5% (live Midnight 12.0.5/12.0.7 Wowhead tooltip:
    # "While you are within your Death and Decay, your physical damage
    # taken is reduced by 5%..."; cross-confirmed via WebSearch 2026-07-31
    # after the two research passes used different-but-consistent spell
    # ids — 434033 is the talent node itself (Passive, "Not In Spellbook",
    # never referenced by literal id in SimC either), 434034 is the actual
    # buff object SimC's midnight branch triggers/expires via
    # death_and_decay_buff_t::trigger_buffs()/expire_buffs() — the same
    # DnD-presence callback the base-tree Sanguine Ground talent uses).
    # Unlike Rune Carved Plates this is flat (no stacks) and physical-only
    # (no magical branch — the ability has no magic-school counterpart).
    # Replay-only, gated on the buff window observed in the log (a
    # Deathbringer build has no Blood-Soaked Ground aura and gets no
    # credit — the same honest failure mode RCP already has in the other
    # direction for San'layn builds; this key closes that gap).
    #
    # PATCH 12.1.0 SCALAR BUMP (prepared 2026-08-07, held for ship ~Aug 11
    # 2026 — see patch/12.1.0-scalars branch / PR): live 5% -> PTR 8%,
    # confirmed verbatim by Warcraft Wiki's Patch 12.1.0 page ("reduces
    # physical damage taken by 8% (was 5%)") and unrevised since the
    # 2026-07-28 PTR research pass. A simple flat replace — this constant
    # was never corpus-fit (Blood DK is `calibrated: false`), so no
    # recalibration is needed alongside the bump.
    blood_soaked_ground_spell_id: 434034
    blood_soaked_ground_physical_dr: 0.08
    # Blood Shield: Death Strike grants an absorb equal to ~50% of the heal
    # amount. Modeled as a healer-absorb addition on the iteration tick.
    blood_shield_pct_of_ds_heal: 0.50
    # Base values (no shield → no block; melee parry instead)
    base_parry_chance: 0.05          # base DK parry (no shield); strength scales
    # Mastery: Blood Shield — 1% mastery → 1% blood-shield absorb increase.
    # Captured indirectly via death_strike_heal_pct (mastery scales DS heal).
    mastery_ds_heal_scaling: 0.005   # 1% mastery → +0.5% DS heal effectiveness

  vengeance_demon_hunter:
    # Coefficients PINNED TO SIMC (midnight branch, build 12.0.5.67823 — see
    # docs/validation/phase4_vdh_characterization_2026_06_09.md + the SimC
    # engine-math audit). The armor formula + K=3430 + 0.85 cap are confirmed
