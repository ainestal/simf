# v42 (2026-07-21): Prot Warrior coupled Shield Block / block-value fix.
# Two real, SimC-source-confirmed bugs shipped together (fixing only one
# swings the ratified corpus materially worse — see the validation doc):
# (1) `core/mitigation.py::calculate_armor_resist` applied its `multiplier`
# to the input value BEFORE dividing by K; SimC's real formula (fetched live
# from `engine/util/util.cpp`, branch `midnight`) divides first, THEN
# multiplies the resulting fraction. Only the crit-block call site
# (multiplier=2.0) was ever affected. (2) Shield Block's flat
# `active_mitigation.shield_block.physical_dr` (was 0.30, now 0.0 —
# uncited, unlike every neighboring constant) was a double-count: SimC's
# real warrior mitigation chain has no separate physical-DR aura on
# Shield Block beyond guaranteeing the block roll, confirmed via SimC
# source, a live Wowhead effect-table fetch (spell 132404's "Mod % Damage
# Taken" effect shows no populated value, unlike its 3 real siblings), and
# an empirical block-rate cross-check (91.2% vs 25.8% in/out of SB windows
# — a real 30% layer would predict a very different ratio). Canonical-K
# (3430) deltas on the ratified 16-log corpus: RMSE 0.138→0.250, mean bias
# +11.5%→+23.0%, 10/16→4/16 within ±15% — WORSE on every headline number,
# and expected to be: removing a broad unconditional 30% cut (fired on
# every physical hit during ~80%+ of fight-time SB uptime, blocked or not)
# outweighs the crit-block formula fix's narrower gain (only on the subset
# of hits that also roll a crit block), net-widening the pre-existing
# "structural physical-mit gap" (see roadmap item 5) the two bugs had been
# accidentally masking. `calibration_tier` and `global_rmse` NOT changed by
# this bump — human ratification pending. A related, weaker-evidenced lead
# (mastery_pct_warrior_prot's base=0.12 may be a stale, uncited placeholder)
# was investigated and deliberately HELD, not shipped — see the doc for why.
# See docs/validation/protwarrior_shield_block_fix_2026_07_21.md.
#
# v43 (2026-07-21): Shield Block's charge recharge is HASTED — SimC source
# confirms (`shield_block_t`'s constructor sets `cooldown->hasted = true;`,
# `engine/class_modules/sc_warrior.cpp`, same `midnight` commit this file's
# other citations use). `core/policy.py`'s press-cadence model was applying
# `active_mitigation.shield_block.recharge_s` (16s) FLAT, un-hasted — every
# character recharged charges at the same rate regardless of haste. This was
# the dominant driver of the v42 fix's +23.0% over-predict: measured directly
# via a real `run_simulation` call against the ratified corpus,
# `SimResult.mean_sb_uptime` (the sim's OWN modeled Shield Block uptime) was
# 59.1% at skill_modifier=1.0 ("in the zone," press-on-cooldown) — dramatically
# below the corpus's real logged SB uptime of 90.1% (time-weighted, from the
# log's own Shield Block aura windows). At Brutoh's calibration haste
# (23.18%), the hasted-recharge fix predicts a steady-state uptime of
# 6/(16/1.2318/2) ≈ 92% — matching the real 90.1% far more closely than the
# un-hasted model's 59.1%. `active_mitigation.shield_block.recharge_s`
# ITSELF is unchanged (still 16, the correct BASE value); only the point of
# use in `core/policy.py` now divides by `(1 + haste_pct)`, mirroring the
# existing hasted-cooldown convention already used for Shield Slam's cycle
# two lines above it. Canonical-K (3430) deltas on the ratified 16-log
# corpus: RMSE 0.250→0.162, mean bias +23.0%→+13.7%, 4/16→8/16 within ±15%
# — a large, real improvement, though still worse than the pre-v42 headline
