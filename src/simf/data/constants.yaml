    # not a self-certified promotion, same posture this project used for
    # every calibration-affecting fix earlier today. See
    # docs/validation/protwarrior_vanguard_strength_armor_2026_07_21.md.
    #
    # LOO-CV gate run 2026-07-22 — `simf calibrate-k` extended with the gate
    # (PR #416, reusing scripts/calibrate_spec_from_logs.py's existing
    # `_run_loo_cv` rather than re-implementing it) against this same
    # ratified corpus with Vanguard live: **PASS** — K stability
    # max|bestK_-i − bestK_full=3250|=180 (≤300 bar), held-out prediction
    # 16/16 (100%) within ±15% (≥75% bar), no fold beyond ±25%. The
    # tightest LOO-CV result this project has measured for any spec
    # (Guardian's two attempts: 71%/69%, both FAIL). See
    # docs/validation/protwarrior_loo_cv_vanguard_2026_07_22.md.
    #
    # RATIFIED 2026-07-22 (human decision): `calibration_tier` promoted
    # `characterized` → `calibrated` below — the first spec to clear ALL
    # FIVE sub-criteria of the promotion bar at once (≥8 F-consistent runs:
    # 15/16; |mean bias|≤5%: +1.8%; ≥75% within ±15%: 16/16; RMSE≤0.15:
    # 0.073; LOO-CV: PASS). Named caveats that carry forward regardless:
    # the cross-spec ~5-7% run-scoped wedge
    # (`docs/validation/phase4_brewmaster_physical_gap_decomposition_2026_07_04.md`)
    # is still open, and the separate ~11% magic-dominated "clean wedge"
    # residual (`scripts/full_chain_wedge.py`) is untouched by Vanguard (a
    # physical-only armor term) and stays a standing lead.
    # Defensive Stance passive: -15% damage taken, all schools. Source: spell
    # data effect 1 of spell 386208 (`base_value = -15.0`, school mask 127 =
    # all schools). SimC parses this via `parse_effects(buff.defensive_stance,
    # effect_mask_t(true).disable(2, 5, 6))` — see
    # docs/simc-reference/warrior_target_mitigation.cpp and AUDIT.md F4.
    #
    # Effects 2 (damage done penalty), 5/6 (Stance Mastery chunk DR) are
    # disabled — effect 2 because Prot doesn't take the offense hit, effects
    # 5/6 because the SimC code comment "Stance Mastery for Defensive stance
    # is not working in game as of Dec 04 2025" flags the chunk-DR variant
    # broken in-game. Effect 3 (magic DR) activates to +6% only when "Fight
    # Through the Flames" talent (spell 452494) is taken — talent-gated in
    # `mitigation.py` (checks `"fight_through_flames" in state.talents`,
    # reads this magnitude from `talents.fight_through_flames.magic_dr`
    # below). Stale TODO fixed 2026-07-11 (talent-leftovers deep review) —
    # this comment previously said the gating wasn't modelled yet; it has
    # been since before this fix, the comment just never caught up.
    #
    # Previously simf used 0.20 magic-only — both scope and magnitude wrong.
    # The 0.20 was empirically derived from MGT+12 magic events to compensate
    # for missing party auras; that conflation moves to party_magic_dr below.
    defensive_stance_dr: 0.15
    # Vanguard — Prot Warrior SPEC PASSIVE (spell 71, find_specialization_spell
    # — always active for every Protection Warrior, NOT a talent, same class
    # of ability as Riposte in base_parry() above). Adds bonus armor =
    # Strength × 70%, same "Mod Armor From Stat %" subtype as Blood DK's
    # `bone_shield_armor_from_strength` below (1.80/180%) — the mechanic
    # class, not the magnitude, matches. Sourced 2 independent ways in
    # agreement: live Wowhead tooltip for spell 71 (raw Playwright
    # accessibility-tree read, 2026-07-21 — Effect #1 "Mod Armor From Stat %",
    # Value 70%; plain-text tooltip "your Armor is increased by 70% of your
    # Strength") and SimC source (`sc_warrior.cpp`, `midnight` commit
    # `fd60a6384dcd55f3737f18f31755141c1fe1e540`,
    # `warrior_t::composite_bonus_armor()`:
    # `ba += spec.vanguard->effectN(1).percent() * current_str;`, gated only
    # on `specialization() == WARRIOR_PROTECTION` — the same Effect #1).
    # `current_str` is total effective Strength (no combat-rating detour —
    # Strength is a primary stat). Resolves the old, now-deleted "empirical
    # 0.258 vs spell value 40%" discrepancy that used to be noted near the
    # `talents:` block: 40% was Vanguard's Effect #2 (Stamina, unrelated to
    # armor, mis-cited), and 0.258 was an empirical fit measured under a
    # replay chain with 3 now-fixed mitigation bugs live (this same day's
    # armor-resist-multiplier-order, Shield-Block-double-count, and
    # hasted-SB-recharge fixes) — neither number was ever the real
    # coefficient. See
    # docs/validation/protwarrior_vanguard_strength_armor_2026_07_21.md.
    vanguard_armor_per_strength: 0.70
    vanguard_spell_id: 71
    # Keep Your Feet on the Ground — Mountain Thane HERO TALENT (spell
    # 438591), a flat -8% ALL-school DR proc while the buff is up (5s,
    # refreshed by Thunder Blast casts every 2-9s in the ratified corpus —
    # NOT a passive, window-gated same as Painbringer/Metamorphosis below).
    # Sourced 2 independent ways in agreement: live Wowhead tooltip fetch for
    # spell 438591 ("Apply Aura: Mod % Damage Taken [all 7 schools] -8%, 5
    # sec") and Warcraft Wiki's tooltip text ("Thunder Blast reduces damage
    # you take by 8% for 5 sec"), talent placement (Mountain Thane, exclusive
    # choice with Steadfast as the Peaks) cross-checked against SimC source
    # (`sc_warrior.cpp`, `find_talent_spell(talent_tree::HERO, "Keep Your
    # Feet on the Ground")`). Measured in the ratified 16-log corpus: the
    # buff's own in/out residual ratio (0.900 all-clean-hits, 0.911
    # non-frost-magic-only) sits within 2-3pp of the tooltip's exact -8%
    # (=0.92) prediction. Window-gated on event.active_buffs in replay (real
    # log windows, io.log_replay.load_replay's buff_ability_ids parameter);
    # the live/synthetic path gets NO credit yet — Thunder Blast has no
    # policy/rotation model (same calibration-path-first staging as
    # Painbringer/Metamorphosis). Does NOT close the whole non-frost-magic
    # residual — resid_out (hits with the buff confirmed down) still sits at
    # 0.90-0.93, an unexplained ~7-10% cut remains. The talent's OTHER
    # component ("Physical damage taken reduced by 2%", a true always-on
    # passive with no discrete buff-application event) is NOT credited here
    # — not yet isolated from the separate "universal ~5-7% wedge", a
    # deliberately deferred follow-up, named not silently absorbed. See
    # docs/validation/protwarrior_magic_wedge_kyfotg_lead_2026_07_22.md.
    keep_feet_on_ground_dr: 0.08
    keep_feet_on_ground_spell_id: 438591
    # Party-aura DR layer — generalised from the previous flat `party_magic_dr`
    # knob to a per-school dict (Phase 3.9.2, 2026-05-24). The schema:
    #   all: applied to BOTH physical and non-physical events.
    #   magic: stacked multiplicatively on `all` for non-physical events.
    # Effective DR for physical = 1 - all. For magic = 1 - (1-all)*(1-magic).
    # Applied only in replay mode (event.is_log_replay) or when callers
    # explicitly set state.party_magic_dr_active. Synthetic predictions
    # stay unbiased so the K calibration on physical-heavy logs is
    # unaffected.
    #
    # Magnitudes: `all: 0.05` anchored to Shaman Earth Shield 4% / Druid
    # Symbol of Hope 5%, the dominant all-school healer-aura class. The
    # parent doc (docs/validation/magic_mit_gap_remeasurement_2026_05_23.md)
    # said this layer would close ~5pp physical; empirical pre-merge gap
    # remeasurement (2026-05-24) showed only +1.33pp because of DR-
    # stacking arithmetic (5% applied multiplicatively on top of an
    # existing 73% DR adds 1.33pp marginal, not 5pp). The doc's "−13pp
    # is one missing layer" thesis is therefore partly wrong; a deeper
    # structural miss remains on physical (likely BfI stack-up + bonus
    # armor + reactive-heal compensation).
    #
    # `magic: 0.00` — the speculative magic-only stack was retuned to
    # zero after pre-merge measurement showed it pushed frost (already
    # +5.68pp over-mit) and nature p90 further into engine over-
    # mitigation territory. Magic schools matched the baseline at
    # magic=0.05 in the under-mit cases (which are dominated by all-
    # school auras anyway). Schema retained for future per-log aura
    # detection that lights up `magic` per real party composition.
    party_dr_by_school:
      all: 0.05
      magic: 0.00

  brewmaster_monk:
    calibration_tier: characterized  # global K=3430; validated 2026-06-07 — over-predicts +27%/+57% at K=3430 (real model gap; see docs/validation/phase4_brewmaster_calibration_2026_06_07.md); F-factor issue blocks calibrated tier, see phase4_brewmaster_physical_gap_decomposition_2026_07_04.md
    # Stagger: a % of incoming damage is *delayed* into a DoT pool that
    # drains over 10s. Purifying Brew clears 50% of the current pool;
    # Ironskin Brew extends stagger duration. The synthetic sim now
    # models the stagger pool explicitly (Phase 4.4) so Purifying Brew
    # actually does something instead of being abstracted as flat DR.
    stagger_pct_physical: 0.40
    stagger_pct_magic: 0.10
    stagger_dot_duration_s: 10.0
    # Ironskin Brew — adds ~5% extra stagger BEYOND base while up;
    # 20s recharge. Modeled as a per-stack stagger boost.
    ironskin_brew_stagger_increase: 0.05
    ironskin_brew_recharge_s: 20.0
    ironskin_brew_avg_uptime: 0.70  # high uptime in active M+
    # Purifying Brew — clears 50% of current stagger pool. Fires when
    # the pool exceeds the threshold (% of max HP). 0.10 is a "press
    # often when ticking heavy" approximation; real high-key Brewmaster
    # purifies near this band rather than waiting for the in-game
    # "heavy stagger" debuff at 30%. Rate-limited by avg-per-minute so
    # a runaway scenario doesn't get free clears.
    purifying_brew_clear_pct: 0.50
    purifying_brew_threshold_pct_of_max_hp: 0.10
    purifying_brew_avg_per_minute: 12.0   # active M+ purify cadence
    # Fortifying Brew: emergency CD
    fortifying_brew_dr: 0.20
    fortifying_brew_duration_s: 15.0
    fortifying_brew_cooldown_s: 360.0   # Midnight 12.0.5 tuning
    # Celestial Brew: absorb shield that scales with recent stagger pool.
    # cooldown_s corrected 2026-08-07: was 60.0, a 33% overstatement that
    # disagreed with this project's OWN research on the same ability
    # (coaching.defensives.brewmaster_monk's registry entry two spells below,
    # cooldown_s: 45 — researched 2026-07-02 against Wowhead/Icy Veins/
    # Method.gg/Maxroll/Peak of Serenity, see
    # docs/validation/coaching_registry_audit_2026_07_02.md). This is a
    # correctness/game-accuracy fix, NOT a mitigation improvement — measured
    # effect is exactly zero on the replay-based calibration corpus (the log's
    # own real absorbed amount is used in replay, never this cooldown) AND
    # exactly zero on a geared tank's forward-sim verdict sweep (the
    # `hp_pct < 0.70` press gate in BrewmasterPolicy.decide() rarely fires for
    # a geared character regardless of cooldown), and mildly NEGATIVE for an
    # undergeared tank (a shorter cooldown slides the same 8s absorb window
    # onto a lower-damage moment before it expires, buying no extra presses).
    # See docs/validation/phase4_brewmaster_celestial_brew_cooldown_fix_2026_08_07.md
    # for the full before/after measurements.
    #
    # PATCH 12.1.0 SCALAR CORRECTION (2026-08-13): PR #472 bumped the absorb
    # constant to 0.25 citing Warcraft Wiki's "+25%" figure, but that figure
    # belongs to a DIFFERENT talent (Awakening Spirit, which modifies
    # Purifying Brew/Stagger absorption, not Celestial Brew's shield) — a
    # research misattribution, not a game-data error. Confirmed 2026-08-13 by
    # a direct Playwright browser fetch of Blizzard's own official patch
    # notes (news.blizzard.com/en-us/article/24293281/curse-of-ula-tek-content-
    # update-notes, Monk/Brewmaster section, expanded and read verbatim — not
    # a third-party wiki paraphrase), cross-checked twice with zero
    # disagreement. The real, verbatim note reads: "Celestial Brew and
    # Celestial Infusion absorb increased by 150% and cooldown increased by
    # 100%." The live tooltip's real mechanic is a flat 2268%-of-Attack-Power
    # absorb, and this constant is itself an unvalidated %-of-max-HP
    # approximation of that (same shape as VDH's Soul Cleave conversion
    # above), never corpus-fit (Brewmaster is `characterized`, not
    # `calibrated`, and this specific constant has no regression history —
    # docs/validation/phase4_audit_2026_05_16.md:248 called 0.20 "roughly
    # right" pre-PTR by inspection, not a fit). Derivation, preserving that
    # same conversion ratio as a defensible same-fidelity carry-forward:
    # absorb 0.20 (pre-12.1.0 baseline) x2.5 ("+150%" = new = old + 1.5*old)
    # = 0.50; cooldown 45.0 (pre-12.1.0 baseline, see the fix note directly
    # above) x2 ("+100%" = doubled) = 90.0.
    celestial_brew_absorb_pct_of_max_hp: 0.50
    celestial_brew_cooldown_s: 90.0
    # --- Hero-talent flat mitigation ledger (Phase 4, 2026-06-07) ---
    # Always-on / averaged-uptime damage-taken reductions the engine applies
    # ONLY when the talent is detected active. The 2026-06-07 characterization
    # (docs/validation/phase4_brewmaster_magic_layers_2026_06_07.md) proved the
    # Brewmaster over-prediction is a HERO-TALENT-DEPENDENT flat DR the engine
    # omits — NOT the absorb/Stagger path — so a single flat constant for all
    # Brewmasters would over-credit builds that lack the talent. Each row is
    # gated, independently checkable, and fails visibly on a build that lacks it.
    #
    # DETECTION NOTE: gated on the talent's BUFF aura `spell_id`, observed in the
    # replay log on the tank. COMBATANT_INFO talents are trait-node-ENTRY ids
    # (124xxx range), NOT spell ids, so `detected_talent_spell_ids` can't carry
    # the buff id — the buff aura is the reliable replay signal. Synthetic /
    # production (non-replay) gating via the trait tree is a follow-up.
    #
    # `dr_pct` is the in-game reduction; `avg_uptime` averages it over the pull
    # (PT is a 6s dodge/parry proc, NOT always-on). `school: all` applies to
    # every event. `dr_pct: 0.08` = the audited Midnight value (2026-04-07
    # hotfix cut PT 10% -> 8%; talent 450992, buff 451230 — verified in-log).
    # `avg_uptime: 0.88` is the *measured* damage-weighted PT uptime on AnonBrewmaster2's
    # +12 (87.7% dmg-weighted; 75.2% wall-clock — the ~12pp gap is the
    # unmitigated opening hit of each pull). One Shado-Pan run; refine when a
    # second lands. NOT 1.0 — the log refutes "always-on".
    # Validated: PT closes most of AnonBrewmaster2's +27% over-prediction; AnonBrewmaster1
    # (Master of Harmony, no PT buff) is correctly unchanged.
    mitigation_ledger:
      - name: predictive_training        # Shado-Pan hero talent
        detect_buff_spell_id: 451230     # "Predictive Training" aura (verified in-log)
        school: all
        dr_pct: 0.08
        avg_uptime: 0.88

