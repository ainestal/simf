specs:
  # `calibration_tier` (Top-5 #4, 2026-07-06 retrospective — replaces the old
  # `calibrated: true/false` boolean): placeholder | characterized |
  # calibrated. Only the top tier means K, mitigation constants, and
  # dispatch are all log-anchored to the Warrior/Guardian parity bar; UI
  # surfaces an amber "uncalibrated spec" warning below it. Promotion
  # criteria: see `core.constants.spec_is_calibrated`'s docstring.
  protection_warrior:
    calibration_tier: characterized  # DOWNGRADED 2026-07-25 — 15 independent WCL players fail this tier's own promotion bar (mean bias +11.0% vs <=5%, 67% vs >=75% within +/-15%); Brutoh-only fit (RMSE 0.080 as of the same-day KYFOTG merge, was 0.073) is still excellent, still blocked only by the cross-player gate — see docs/validation/protwarrior_calibrated_downgrade_2026_07_25.md and docs/validation/protwarrior_cross_player_validation_gate_2026_07_25.md
    # DOWNGRADED calibrated → characterized 2026-07-18 (human-ratified). Was
    # calibrated:true on RMSE 0.068 (2026-05-18 structural fix) — that number
    # was measured with a replay-side Demo Shout + Phalanx double-count live
    # (attacker-side debuffs re-applied on top of a base_amount that already
    # contains them). Fixed in PR #387; post-fix the same 16-log corpus at the
    # pinned canonical K=3430 reads RMSE 0.138, mean +11.5% over-predict (biased
    # — fails this project's own unbiased bar for `calibrated`). The underlying
    # engine model did not regress — the fix only unmasked an already-known,
    # separately-tracked mob-side wedge (the "structural physical-mit gap")
    # that had been silently canceling this bug. A per-run F-factor fast-follow
    # measuring that wedge should return this to ~+5% residual and likely
    # re-earn `calibrated` with cleaner attribution than it ever had. See
    # docs/validation/protwarrior_demo_shout_double_count_2026_07_17.md.
    #
    # F-layer fast-follow measured 2026-07-21 (`simf calibrate-k` now reports
    # per-run F — see docs/validation/protwarrior_f_layer_measurement_2026_07_21.md):
    # this corpus IS F-consistent (median F=0.699, 15/16 runs within ±0.05 —
    # a real, clean signal, same band convention used to gate other specs).
    # BUT the naive "sim × F" residual correction the note above anticipated
    # is INVALID as specified and does NOT confirm the "~+5%" prediction —
    # measure_run_f.py's F is relative to armor+versatility ONLY and does not
    # divide out this spec's own Defensive Stance -15% (already inside every
    # `sim` value), so multiplying sim by F double-counts it (empirically
    # confirmed: it flips +11.5% over-predict into -22.3% mean bias, not
    # toward +5%). Values here were UNCHANGED at the time (still RMSE 0.138,
    # `characterized`) pending the correctly-scoped follow-up: a
    # per-hit-forensics wedge (dividing out the FULL always-on chain, not
    # just armor+vers) across the whole 16-log corpus, not just the 2 logs
    # checked so far — see the Shield Block fixes and RATIFIED note below,
    # which is that follow-up.
    #
    # Shield Block / calculate_armor_resist coupled fix (2026-07-21) — see
    # docs/validation/protwarrior_shield_block_fix_2026_07_21.md. That
    # per-hit-forensics wedge (run as `scripts/full_chain_wedge.py`) is what
    # surfaced the follow-up above: it found Shield Block's flat 30%
    # physical-DR layer (mitigation.py step "5b") does not exist in SimC's
    # real mitigation chain — a double-count — COUPLED with a genuine
    # transcription bug in `calculate_armor_resist` (multiplier applied to
    # the input value instead of the resulting DR fraction, diverging from
    # SimC only on the crit-block call site). Both fixed together (deleting
    # step 5b was independently confirmed to swing the corpus MUCH worse
    # alone, +11.5%→+32.4%, without the formula fix). Net result at
    # canonical K=3430: RMSE 0.138→0.250, mean bias +11.5%→+23.0%, 10/16→
    # 4/16 within ±15% — worse on every headline number, and expected to be:
    # this closes the "block-value magnitude" half of the gap (modeled
    # blended block DR moves from ~49% to ~59.5%, close to the corpus's own
    # measured real ~57%) while removing a broader, unconditional mitigation
    # cut that had been masking most of the pre-existing structural
    # physical-mit gap (roadmap item 5). Stays `characterized` — this is a
    # code-correctness fix, not a recalibration; at the time it shipped the
    # resulting number was pending human ratification, not a self-certified
    # promotion or demotion (see RATIFIED note below).
    #
    # Hasted Shield Block recharge fix (2026-07-21, same day) — see
    # docs/validation/protwarrior_post_shield_block_bias_decomposition_2026_07_21.md.
    # Decomposing the v42 fix's +23.0% bias found the dominant driver:
    # `core/policy.py`'s Shield Block press-cadence model recharged charges
    # at a flat, un-hasted 16s, while SimC source confirms the real ability's
    # cooldown IS hasted (`cooldown->hasted = true;`). A real `run_simulation`
    # call against the ratified corpus showed the sim's OWN modeled SB uptime
    # (`SimResult.mean_sb_uptime`, skill_modifier=1.0) was only 59.1% against
    # the corpus's real logged SB uptime of 90.1% — the sim believed Shield
    # Block was down for ~41% of every fight when the real player kept it up
    # ~90% of the time. Fixed by dividing the recharge by `(1 + haste_pct)`,
    # mirroring the existing hasted-cooldown convention already used for
    # Shield Slam's cycle. Canonical-K (3430) deltas: RMSE 0.250→0.162, mean
    # bias +23.0%→+13.7%, 4/16→8/16 within ±15% — closes most, not all, of
    # the v42 gap. Also checked and refuted as contributors: avoidance
    # (dodge/parry) frequency — structurally calibration-INERT, `log_replay.py`
    # sets `is_avoidable=False` unconditionally on every mob-sourced replayed
    # event, so the avoidance roll never fires during a `calibrate-k` sweep
    # regardless of how well the modeled rate matches reality (it does,
    # within ~1pp) — and a "does the outside-SB minority carry
    # disproportionate damage" hypothesis (physical-non-bleed hits outside a
    # real SB window are 2.07% of that population's hit count AND 2.49% of
    # its damage — proportionate, not disproportionate; refuted). Stays
    # `characterized` — still a code-correctness fix, not a recalibration;
    # at the time it shipped this was pending human ratification like v42.
    #
    # RATIFIED 2026-07-21 (same day, following human review — see the
    # matching `calibration:` block above for the full reasoning). This
    # inline comment and `global_rmse` above are updated to the final
    # measured state (RMSE 0.162, mean bias +13.7%, 8/16 within ±15%).
    # `calibration_tier` stays `characterized`: today's state clears none of
    # the four `calibrated` promotion-bar gates in `core/constants.py`
    # (|mean bias|≤5%, ≥75% within ±15%, RMSE≤0.15, plus LOO-CV), and is
