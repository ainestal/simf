# simf — Midnight 12.0.5 Season 1 defensive tank trinket catalog
# Sourced from Icy Veins, Method.gg, Wowhead, and Warcraft Wiki (May 2026).
# All effect values are at Normal-mode base ilvl unless noted.
# Stat values use the same rating convention as constants.yaml:
#   rating = percent × 100  (e.g. 2.5% versatility = versatility_rating: 250)
# Items marked VERIFY need in-game confirmation for exact numbers.
# ilvl_base is the Normal-difficulty drop ilvl.
# ilvl_scaling: heroic +13, mythic +26 above base (standard Midnight S1 gaps).

