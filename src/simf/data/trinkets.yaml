  - id: 250256
    name: "Heart of Wind"
    source: "Restless Heart – Windrunner Spire (M+ Dungeon)"
    ilvl_base: 250             # M+ +2 drop floor
    type: "proc_stat"
    stats:
      # Re-verified 2026-06-10's Season 2 punch-list item (2026-07-26): the
      # old figure was a PROPORTIONAL backscale (value × 250/272) from a
      # render 22 ilvls away — wrong functional form. Live Wowhead renders
      # at ilvl 246 (+79) and 253 (+84) — the tightest bracket the known
      # upgrade-track bonus_id ladder offers around 250 — interpolate to
      # +82 at 250 (79 + 5×4/7). The old proportional method assumes the
      # stat is proportional to ilvl (passes through the origin); it isn't
      # — trinket primary-stat budgets grow super-linearly with ilvl (local
      # slope 0.71/ilvl at 246-253 vs 1.11/ilvl at 289-298), so anchoring on
      # a distant high-ilvl render both used the wrong shape AND borrowed a
      # steeper slope than the true one near 250, compounding into a real
      # 13% overstatement (93 → 82). `optimizer/trinket_db.py`'s docstring
      # confirms passive stats are used as-is (not further ilvl-scaled),
      # so this number is exactly what "not yet owned" Vault/Gear cards
      # show for this trinket at its drop floor.
      agility_or_strength: 82
    effect:
      type: haste_proc
      # "Your spells and abilities have a chance to awaken the Heart of Wind,
      # surrounding you with strong gales that increase your Haste by X for
      # 10s." Re-verified 2026-07-26: live renders at 246 (+208), 253
      # (+217), and 289 (+264, cross-checked via the live rendered page)
      # all agree on one constant slope (~1.29/ilvl, unlike the primary
      # stat above) — interpolating that same slope to 250 gives 213, a
      # much smaller correction (-4%) than the primary stat's, since a
      # constant-slope quantity doesn't compound the same way when
      # backscaled from a nearby ilvl (272 is only 22 away, not 39-48).
      stat_key: haste_rating
      value: 213
      duration_s: 10.0
      # proc_ppm stays VERIFY — re-checked live (2026-07-26, both the raw
      # Wowhead &xml tooltip endpoint and a real headless-browser render of
      # the item page) and found no proc-rate data exposed anywhere for
      # this item; whatever sourced the original "~3 RPPM" estimate isn't
      # reproducible via any tool available here. Leave as an estimate —
      # don't re-attempt the same lookup path in a future session.
      proc_ppm: 3.0            # VERIFY — unverifiable via Wowhead's item/xml or rendered page (checked 2026-07-26)
      icd_s: 0.0
    tanks: all
    notes: "A-tier stat stick from M+. Passive primary stat + haste proc. Popular choice for tanks who want dungeon-accessible throughput and rage generation (haste helps warriors)."

  - id: 250241
    name: "Mark of Light"
    source: "Lothraxion – Nexus-Point Xenas (M+ Dungeon)"
    ilvl_base: 250             # M+ +2 drop floor
    type: "proc_stat"
    stats:
      # Re-verified 2026-07-26 (Season 2 punch-list item) — same fix as
      # Heart of Wind's stat line above, same root cause: the old figure
      # backscaled proportionally from a 289/298 render (39-48 ilvls away)
      # assuming the stat is proportional to ilvl. Live renders at 246
      # (+79) and 253 (+84) — sharing the identical trinket primary-stat
      # budget Heart of Wind's own 246/253 renders show, confirming
      # trinkets at a given ilvl+quality share one budget curve regardless
      # of which stat is labeled — interpolate to +82 at 250, a 23% cut
      # from the old 107.
      strength: 82
    effect:
      # "Your attacks have a chance to unleash a Radiant Strike at your target,
      # dealing Holy damage split among nearby enemies." (Wowhead spell 1250582.)
      # Pure offensive proc — no absorb / heal / DR rider (verified on the spell
      # tooltip 2026-06-10). No stat_key on purpose: the defensive ledger credits
      # the passive Strength only, same convention as Undreamt God's Oozing Vestige.
      type: damage_proc
      # Re-verified 2026-07-26: the old 10881 backscaled proportionally
      # from the 289 render (12579), 39 ilvls away. Live renders at 246
      # (6603) and 253 (7095) bracket ilvl_base=250 tightly (interpolate:
      # 6603 + 492×4/7 = 6884) — a 37% cut from the old figure, the
      # largest correction of this sweep, since damage compounds the same
      # super-linear-budget error the primary stat does (local slope
      # 70.3/ilvl at 246-253 vs ~202/ilvl between the 289/298 renders —
      # nearly 3× steeper far from 250 than close to it).
      damage: 6884
      proc_ppm: 3.5            # VERIFY — same unverifiable-via-available-tools status as Heart of Wind's proc_ppm above (checked 2026-07-26)
      splits: true             # damage splits among nearby enemies — wanes on big pulls
      icd_s: 0.0
    tanks: all
    notes: "Offensive proc stick: passive Strength + Holy damage proc. Zero direct survivability contribution beyond the passive Strength (which the closed-form eHP ledger doesn't credit for warriors). DPS proc splits among enemies, so single-target padding, weak on large M+ pulls."

