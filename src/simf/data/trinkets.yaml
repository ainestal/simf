  - id: 249339
    name: "Gloom-Spattered Dreadscale"
    source: "Vaelgor & Ezzorak – The Voidspire (Raid)"
    ilvl_base: 253
    type: "on_use_absorb"
    stats:
      crit_rating: 95            # passive secondary stat (VERIFY exact value)
    effect:
      type: absorb
      # "Unleash hungering Gloom: deals 75503 Shadow dmg split between nearby
      # enemies AND absorbs up to 50% of incoming damage until equal amount prevented.
      # Damage +30% per additional enemy hit, up to 150%."
      damage_to_enemies: 75503   # at base ilvl; scales with ilvl
      absorb_pct_of_damage: 0.50 # absorbs 50% of damage dealt (equal-amount cap)
      # Practical absorb shield at 1 target ≈ 75503×0.5 = ~37750; scales to ~113k at 3+ targets
      value: 37750               # conservative single-target estimate at base ilvl
      cooldown_s: 120.0
      duration_s: 0.0            # no expiration timer; see duration_model below
      duration_model: "until_consumed" # shield persists until its absorb cap is
                                  # used up, not a fixed window — trinket_db.py's
                                  # on_use_absorb handler branches on this (a bare
                                  # duration_s: 0.0 would silently compute uptime=0)
    tanks: all
    notes: "Top defensive on-use. Absorb scales with nearby enemies—best on AoE pulls. 2-min CD makes it poolable for dangerous windows."

