    # docs/validation/mgt_12_2026_05_15.md for the per-ability breakdown.
    school_mix:
      physical: 0.55
      shadow:   0.30
      arcane:   0.10
      fire:     0.05
    description: >
      Burning Crusade Sin'dorei spire. Heavy shadow-school caster pressure on
      the Selin / Vexallus / Degentrius pulls. Magic mit had a documented
      -14pp shadow gap pre-2026-05-16; closed to -4.5pp by the Phalanx + party
      magic-DR fix in commit 0a65396. Calibration: +3.9% mean gap across 3
      replays (+12 / +13 / +14); ranges +0.2% to +6.4%. Refit 2026-05-18.
