      replays (+12 / +13 / +13 / +14); range -0.5% to +4.9%. Best-fit dungeon
      in the corpus. Refit 2026-05-18.

  - id: skyreach
    name: "Skyreach"
    abbrev: Sky
    map_id: 1209
    par_time_ms: null  # TODO: verify against a real depleted Skyreach log
    recommended_profile: m+_pull_caster
    school_mix:
      physical: 0.60
      fire:     0.30
      air:      0.10
    description: >
      Warlords of Draenor Arakkoa sun temple. Physical melee with fire and air
      caster pressure. Calibration: -11.3% gap at +14 (1 partial replay, no
      CHALLENGE_MODE_END). Crosses the |10%| trust threshold but the sample is
      thin — needs a second full-completion Skyreach replay to confirm.

  - id: seat_of_the_triumvirate
    name: "Seat of the Triumvirate"
    abbrev: SotT
    map_id: 1753
    par_time_ms: null  # TODO: verify against a real depleted SotT log
    recommended_profile: m+_dungeon_spelldrain
    school_mix:
      physical: 0.20
      arcane:   0.45
      shadow:   0.35
    description: >
      Legion void-touched eredar fortress. Arcane and void/shadow magic dominates.
      Very little blockable physical — Shield Block has reduced value here.

  - id: maisara_caverns
    name: "Maisara Caverns"
    abbrev: MaiC
    map_id: 2874
    par_time_ms: null  # TODO: verify against a real depleted Maisara log
    recommended_profile: m+_aoe_dot_pull
    school_mix:
      physical: 0.55
      nature:   0.25
      shadow:   0.20
    description: >
      New Midnight dungeon. Mixed physical melee with nature/shadow casters.
      Calibration: -0.4% mean gap across 2 replays (+12: -4.1%, +14: +3.2%);
      dramatically improved from -8.7% single-replay 2026-05-16 calibration —
      the second replay revealed the original gap was noise. Refit 2026-05-18.

  - id: magisters_terrace
    name: "Magisters' Terrace"
    abbrev: MGT
    map_id: 2811
    par_time_ms: null  # TODO: verify against a real depleted MGT log
    recommended_profile: m+_dungeon_spelldrain
    # School mix derived from Brutoh's +12 validation log (2026-05-15,
    # WoWCombatLog-051526_210245.txt): auto-attack carries 76.7% of pre-mit
    # damage; remainder is shadow-heavy (Umbral Splinters, Void Destruction,
