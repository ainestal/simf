    # Source: wowhead.com/item-set=1978/relentless-riders-lament
    # Slot mapping verified against warcraft.wiki.gg/wiki/Relentless_Rider's_Lament.
    # Wowhead's slot inference mistakenly labels Dreadthorns as feet — wiki
