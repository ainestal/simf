# simf — Midnight Season 1 tank tier-set registry
#
# Tier sets are 5-piece bonuses with thresholds at 2pc and 4pc. Slots: head,
# shoulder, chest, hands, legs (standard for Midnight S1). The fifth piece
# rotates depending on raid/crafting drop tables.
#
# Item ids are the BoP equipment-set droppable versions. Catalyst conversions
# share the same id because they remap to the same set bonus.
#
# Source: Wowhead set page + in-game tooltip (2026-05-15). Spec field maps to
# `Character.class_spec` so multi-spec tier (e.g. shared paladin pieces) lists
# every spec it applies to.
#
# Bonus copy is preserved verbatim from Wowhead / Maxroll tooltips, including
# minor typos ("beyong", missing "and") — fixing them would risk drifting from
# the in-game string the user is comparing against.

sets:
  - id: night_ender_warrior
    name: "Night Ender's Vesture"
    spec: protection_warrior
    # Item ids drawn from Brutoh's brutoh-vault.simc — Night Ender pieces
    # are the Midnight S1 Protection Warrior tier set.
    # 5-slot set; head was previously missing from this list (latent bug
    # discovered during the v0.9.4 cross-spec expansion — the comment
    # "head / shoulder" on 249950 was wrong; 249950 is shoulder only).
    item_ids:
      - 249952  # head  — Night Ender's Tusks
      - 249950  # shoulder — Night Ender's Pauldrons
      - 249955  # chest — Night Ender's Breastplate
      - 249953  # hands — Night Ender's Fists
      - 249951  # legs — Night Ender's Chausses
    # 2pc + 4pc bonus copy from the in-game tooltip. Defensive flavour;
    # not modeled mathematically yet — these strings exist so the UI can
    # surface what the bonus actually does when N pieces are equipped.
    bonus_2pc: "Shield Block reduces magic damage taken by 8% for its duration."
    bonus_4pc: "Devastate has a 10% chance to grant 20s of Shield Block."

  - id: luminant_verdict_paladin
    name: "Luminant Verdict's Vestments"
    spec: protection_paladin
    # Source: wowhead.com/item-set=1985/luminant-verdicts-vestments
    # Slot mapping verified against warcraft.wiki.gg/wiki/Luminant_Verdict's_Vestments.
    item_ids:
      - 249961  # head — Luminant Verdict's Unwavering Gaze
      - 249959  # shoulder — Luminant Verdict's Providence Watch
      - 249964  # chest — Luminant Verdict's Divine Warplate
      - 249962  # hands — Luminant Verdict's Gauntlets
      - 249960  # legs — Luminant Verdict's Greaves
    bonus_2pc: "Shield of the Righteous deals 20% increased damage."
    bonus_4pc: "After casting Shield of the Righteous, your next Avenger's Shield deals 5% increased damage. Stacks up to 5."

