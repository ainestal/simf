    # Slot mapping verified against warcraft.wiki.gg/wiki/Way_of_Ra-den's_Chosen.
    item_ids:
      - 250015  # head — Fearsome Visage of Ra-den's Chosen
      - 250013  # shoulder — Aurastones of Ra-den's Chosen
      - 250018  # chest — Battle Garb of Ra-den's Chosen
      - 250016  # hands — Thunderfists of Ra-den's Chosen
      - 250014  # legs — Swiftsweepers of Ra-den's Chosen
    bonus_2pc: "Keg Smash damage increased by 10%. Breath of Fire damage increased by 10%."
    bonus_4pc: "Keg Smash's Energy cost is reduced by 5 and when it strikes a target afflicted by Breath of Fire it deals additional Fire damage."

  - id: luminous_bloom_druid
