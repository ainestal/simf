    # Slot mapping verified against warcraft.wiki.gg/wiki/Sprouts_of_the_Luminous_Bloom.
    # Wowhead's set page lists pieces without slot labels — paired by item name.
    item_ids:
      - 250024  # head — Branches of the Luminous Bloom
      - 250022  # shoulder — Seedpods of the Luminous Bloom
      - 250027  # chest — Trunk of the Luminous Bloom
      - 250025  # hands — Arbortenders of the Luminous Bloom
      - 250023  # legs — Phloemwraps of the Luminous Bloom
    bonus_2pc: "Raze and Ravage damage increased by 10%. Moonfire deal 10% increased damage."
    bonus_4pc: "Raze and Ravage have an additional 5% chance to activate Galactic Guardian. Moonfire's periodic damage has a chance to make your next Raze or Ravage strike again at 100% effectiveness."

  - id: relentless_rider_dk
