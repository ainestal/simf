# protection_paladin — cross-player WCL accuracy check (2026-08-14).
#
# NOT a ratified calibration manifest. This is a reusable record of 5 real,
# independent-player WCL fights (zone 47, "Mythic+ Season 1"), discovered via
# reportData.reports(zoneID: 47) (a global recent-public-reports feed that,
# unlike characterRankings, does not redact report/fight codes) and confirmed
# ACL-on via CombatantInfo. Used to spot-check whether simf's predictions
# hold up against fresh, live-patch (12.1.0) play this project didn't already
# have logs for. See docs/validation/cross_spec_accuracy_check_2026_08_14.md.
#
# Deltas measured at canonical K=3430, iterations=50, seed=42,
# healing_profile=m+_high_key_healer, via scripts/cross_player_validation.py
# (the same tool + gate used for Prot Warrior's 2026-07-25 cross-player check).

