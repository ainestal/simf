# protection_warrior — Season 2 (zone 55) cross-player accuracy spot-check,
# bucketed by target keystone level (2026-08-30).
#
# NOT a ratified calibration manifest. This is a reusable record of 12 real,
# independent-player WCL fights from Midnight Mythic+ Season 2 (WCL zone 55,
# "Mythic+ Season 2"), discovered via reportData.reports(zoneID: 55) (the
# same global recent-public-reports feed used for the 2026-08-14 cross-spec
# check, which — unlike characterRankings — does not redact report/fight
# codes) and confirmed ACL-on via CombatantInfo. Fights are grouped into 4
# buckets targeting key levels 2, 8, 12, and 16 (3 fights each); where an
# exact-key-level match wasn't available within the scan budget, the nearest
# available key level was accepted (see `exact_match: false` entries) per
# the discovery task's +/-2 widening rule. Used to spot-check whether simf's
# Prot Warrior predictions hold up across key-level depth on fresh, live-S2
# play this project didn't already have logs for.
#
# Deltas measured at canonical K=3430, iterations=50, seed=42,
# healing_profile=m+_high_key_healer, via scripts/cross_player_validation.py
# (the same tool + gate used for the 2026-07-25 and 2026-08-14 cross-player
# checks).

spec: protection_warrior
k_constant: 3430
iterations: 50

fights:
  # --- target_key_level: 2 ---
  - player: "Player 1"
    dungeon: "Voidscar Arena"
    key_level: 2
    target_key_level: 2
    exact_match: true
    acl: true

  - player: "Player 2"
    dungeon: "Kings' Rest"
    key_level: 3
    target_key_level: 2
    exact_match: false
    acl: true

