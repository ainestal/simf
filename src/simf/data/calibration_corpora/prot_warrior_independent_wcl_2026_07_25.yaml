# Prot Warrior — INDEPENDENT-PLAYER diagnostic cross-check corpus (2026-07-25).
#
# NOT the ratified calibration manifest (that stays prot_warrior_2026_05.yaml,
# Brutoh-only, unaffected by this file). This is a reusable record of 15 real,
# other-player WCL fights found via characterRankings (zone 47, "Mythic+
# Season 1"), used to test whether the Brutoh-only ratified calibration
# generalizes. See docs/validation/protwarrior_independent_players_2026_07_25.md
# and docs/validation/protwarrior_independent_players_lowkey_2026_07_25.md.
#
# Discovery method: worldData.encounter(id).characterRankings(className:
# "Warrior", specName: "Protection"), EU/US region, deduped to distinct
# players, one per dungeon per batch. The "highkey" batch is page 1 (top
# parses, naturally +20-22 — WCL's ranking score heavily favors high keys).
# The "lowkey" batch pages deep (page ~18) to reach the LOWEST key level each
# dungeon's rankings index still covers — empirically +17-18, NOT the
# originally-hoped +12-14 (the rankings index caps out and returns nothing
# past roughly page 25-29; low keys apparently aren't indexed as "notable"
# parses at all, regardless of how deep you page).
#
# Raw WCL API responses (damage events, CombatantInfo, report metadata) for
# every fight below are cached at examples/wcl_cache/ (gitignored, git-local
# only) via wcl_api._gql's opt-in cache_dir — re-running calibrate-k
# --wcl-url --wcl-cache-dir examples/wcl_cache against any of these will not
# re-hit the network. Deltas below were measured on branch
# calibration/protwarrior-kyfotg-magic-dr (KYFOTG credit LIVE) at fixed
# K=3430, iterations=50 — NOT comparable to a run without that credit.

spec: protection_warrior
source_doc: docs/validation/protwarrior_independent_players_lowkey_2026_07_25.md
measured_with: calibration/protwarrior-kyfotg-magic-dr  # KYFOTG credit live
k_constant: 3430
iterations: 50

fights:
  # --- "highkey" batch — page 1 (top parses), naturally +20-22 ---
  - player: AnonPlayerX4
    region: US
    dungeon: "Algeth'ar Academy"
    key_level: 22
    acl: true
    kyfotg_present: true
    delta_at_k3430: 7.3
    batch: highkey
  - player: Player 1
    region: EU
    dungeon: "Magisters' Terrace"
