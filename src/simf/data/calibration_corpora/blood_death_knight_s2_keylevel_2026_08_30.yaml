# blood_death_knight — Season 2 (zone 55) cross-player accuracy spot-check,
# bucketed by target keystone level (2026-08-30).
#
# NOT a ratified calibration manifest. This is a reusable record of 12 real,
# independent-player WCL fights from Midnight Mythic+ Season 2 (WCL zone 55,
# "Mythic+ Season 2"), discovered via reportData.reports(zoneID: 55) (the
# same global recent-public-reports feed used for the 2026-08-14 cross-spec
# check, which — unlike characterRankings — does not redact report/fight
# codes) and confirmed ACL-on via CombatantInfo. Fights are grouped into 4
# buckets targeting key levels 2, 8, 12, and 16 (3 fights each); every bucket
# was filled with an EXACT key-level match — no +/-2 tolerance widening was
# needed despite the discovery script being allowed to widen after 150
# reports (only 149 reports were scanned in total). Used to spot-check
# whether simf's Blood Death Knight predictions hold up across key-level
# depth on fresh, live-S2 play this project didn't already have logs for.
#
# Deltas measured at canonical K=3430, iterations=50, seed=42,
# healing_profile=m+_high_key_healer, via scripts/cross_player_validation.py
# (the same tool + gate used for the 2026-07-25, 2026-08-14, and the
# protection_warrior/protection_paladin 2026-08-30 cross-player checks).

spec: blood_death_knight
k_constant: 3430
iterations: 50

fights:
  # --- target_key_level: 2 ---
  - player: "Player 1"
    dungeon: "Den of Nalorakk"
    key_level: 2
    target_key_level: 2
    exact_match: true
    acl: true

  - player: "Player 2"
    dungeon: "Kings' Rest"
    key_level: 2
    target_key_level: 2
    exact_match: true
    acl: true

