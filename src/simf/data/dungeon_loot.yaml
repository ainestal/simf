# M+ dungeon loot — items the user can chase. Powers the "From M+ dungeons"
# section of the slot dialog: when the user opens a slot, simf lists any
# items dropped by their prog-filtered dungeons as additional alternatives
# alongside their bag + vault picks. Each item rides through the same
# stat-resolution path (Wowhead by id) and the same ΔeHP scorer, so the
# row reads exactly like a bag/vault alternative — just with an "m+ <DUN>"
# source label.
#
# Schema:
#   dungeons:
#     <dungeon_id>:
#       items:
#         - id: <int>           # Wowhead / Blizzard item id
#           name: <str>         # display name
#           slot: <str>         # ItemSpec.slot key (head/chest/.../trinket1/main_hand)
#           ilvl: <int>         # Midnight 12.0.5 base drop floor at M+ +2 (250). Matches the
#                               # raid-Normal convention in trinkets.yaml. Per-key ilvl bumps
#                               # (+6 end-of-run = 259, +10 cap = 266, vault = 272) and Voidcore
#                               # / Ascendant Voidcore upgrades scale on top of this baseline via
#                               # ``character_ilvl / base_ilvl`` — the Voidcore upgrade panel and
#                               # Wowhead's bonus_id-aware stats lookup handle that separately.
#           drop: <str>         # boss/encounter (free-form, shown in tooltip-style detail)
#           # Optional:
#           # bonus_ids: [int]  # if a non-base bonus list is needed for Wowhead
#
# Maintenance: when the season ilvl baseline shifts, the `ilvl` field is
# advisory (the actual stat scaling comes from Wowhead). When loot tables
# change between hotfixes, edit this file and bump `last_updated`.
#
# Coverage today:
#   * Trinkets — sourced from data/trinkets.yaml entries that already name an
#     "M+ Dungeon" drop. 6 of 8 dungeons covered (Maisara Caverns and
#     Nexus-Point Xenas have no M+ trinket in the trinkets.yaml seed).
#   * Plate slots (head / chest / shoulder / hands / legs / waist / wrist /
#     feet) — populated for all 8 dungeons from conquestcapped.com's M+ gear
#     guide, spot-checked against Wowhead's item-XML endpoint.
#   * Leather slots (head / shoulder / chest / hands / wrist / waist / legs /
#     feet) — populated 2026-05-23 from the same conquestcapped table for the
#     non-plate tank specs (Guardian Druid, Brewmaster Monk, Vengeance DH).
#     25 items across all 8 dungeons; per-slot coverage mirrors what plate
#     gets (no dungeon drops every slot — that's the source-of-truth state).
#   * Universal slots (neck / finger / back / main_hand / off_hand) —
#     populated for the dungeons that drop them. ``finger1`` is the
#     canonical key per ``alternatives.equivalent_slots``; the slot dialog
#     surfaces these on both ``finger1`` and ``finger2`` clicks. Same for
#     ``trinket1`` / ``trinket2``.
#   * Mail / cloth — intentionally NOT covered. No tank spec wears either
#     armor class in Midnight 12.0.5: Shamans/Hunters/Evokers (mail) and
#     Priests/Mages/Warlocks (cloth) have no tank specs. The CONTRIBUTING.md
#     priority list groups these under "mail/leather/cloth" but tank
#     survivability only needs leather expansion.
#
# Sources:
#   * Item IDs + names + slot mapping:
#     https://conquestcapped.com/guides/wow/mythic-plus-gear/ (2026-05).
#     This is the only aggregated M+ gear table that survived a WebFetch
#     scrape from the Pi — Wowhead's per-dungeon pages are JS-rendered and
#     return navigation chrome instead of loot tables.
#   * Trinket entries: ../trinkets.yaml (already curated for survivability).

last_updated: 2026-05-23
patch: "12.0.5"
notes: |
  ilvls reflect the Midnight 12.0.5 M+ +2 drop floor (250), matching the
  Normal-difficulty baseline convention in trinkets.yaml. Per-key ilvl
  bumps + Voidcore / Ascendant Voidcore upgrades scale on top of this
  baseline; the Voidcore upgrade panel and the character-ilvl ratio in
  trinket_db.effective_stat_delta handle the scaling separately. Plate,
  leather, and universal-slot (neck / finger / back / main-hand /
  off-hand) coverage is comprehensive across the 8 dungeons. Mail and
  cloth are intentionally not covered — neither has a tank spec in
  Midnight 12.0.5, so adding them would be pure noise for the
  survivability use case.

