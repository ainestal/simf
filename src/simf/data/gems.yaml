# Midnight 12.0.5 gem catalog — tank-relevant gems for the survival gem suggester.
#
# Every numeric value below was CONFIRMED via a direct Wowhead `&xml` item
# fetch (2026-06-24). The Midnight gem system, verified across all four colors:
#
#   - Four base colors, each a secondary stat:
#       Peridot = Haste, Lapis = Versatility, Garnet = Crit, Amethyst = Mastery
#   - A prefix adds a second stat: Quick=Haste, Versatile=Vers, Deadly=Crit,
#     Masterful=Mastery.
#   - PURE-stat gem (prefix matches the base colour, e.g. "Versatile Lapis")
#     collapses to a single +17 of that stat — NOT 16+7.
#   - HYBRID gem (prefix differs from base) = +16 base stat & +7 prefix stat.
#   - Two ilvl tiers share names (older 278 = +14/+6, max 295 = +16/+7); the
#     IDs below are the ilvl-295 (max) tier.
#   - "Eversong Diamond" metas are the only primary-stat gems and are
#     Unique-Equipped (Thalassian Diamond — only ONE socketable on a character).
#
# THERE IS NO STAMINA GEM in Midnight 12.0.5. The only non-secondary survival
# stats obtainable from any gem are primary stat (Eversong Diamond) and +13
# Armor (Stoic Eversong Diamond meta only). This is load-bearing for the
# suggester: a tank cannot gem pure stamina.
#
# `stats` keys are the canonical marginal keys used everywhere else
# (core/marginals.py, optimizer/per_dungeon.py):
#   primary  -> resolved to `agility` or `strength` per spec by the suggester
#   armor_from_gear, haste_rating, crit_rating, mastery_rating, versatility_rating
#
# The suggester scores each gem by Σ_stat (∂eHP/∂stat × gem_stat) against the
# character's sim-derived marginals, so crit/mastery/haste gems automatically
# score 0 survival for specs whose marginal for that stat is 0 (e.g. haste is 0
# for every spec except an Elune's-Chosen Guardian). No per-gem spec logic.

gems:
  # ---- Eversong Diamond metas (Unique-Equipped: only ONE socketable) -------
  - id: 240983
    name: Indecipherable Eversong Diamond
    ilvl: 295
    unique_equipped: true
    stats: {primary: 32}

  - id: 240971
    name: Stoic Eversong Diamond
    ilvl: 295
    unique_equipped: true
    # The one defensive meta: +23 primary AND +13 Armor. Armor carries real
    # eHP for every tank, so this competes with Indecipherable for the single
    # Thalassian Diamond slot on plate tanks where primary (strength) is weak.
    stats: {primary: 23, armor_from_gear: 13}

  - id: 240967
    name: Powerful Eversong Diamond
    ilvl: 295
    unique_equipped: true
    # +23 primary plus a +crit-effectiveness-per-colour proc that is NOT a flat
    # stat, so the suggester only credits the +23 primary (the proc has no
    # survival value modelled).
    stats: {primary: 23}

