# M+ damage scaling per key level — Midnight Season 1 (patch 12.0.5)
#
# damage_multiplier: relative incoming damage vs key level 10 baseline (= 1.0)
# Source: community-measured scaling ~8% per level above 2, anchored on
# calibration logs (WR+12 ≈ actual DTPS, PoS+13 ≈ actual DTPS).
#
# Affixes applied ON TOP of this base multiplier:
#   fortified:   non-boss events × 1.30
#   tyrannical:  boss events × 1.15
#
# death_rate_safe_threshold:  death rate below which a key is "comfortable"
# death_rate_prog_threshold:  death rate below which a key is "progression-viable"

affixes:
  fortified_non_boss_multiplier: 1.30
  tyrannical_boss_multiplier: 1.15

death_rate_thresholds:
  comfortable:   0.05   # < 5% death rate = safe
  progression:   0.25   # < 25% = hard but doable (Brutoh-tier push window)
  dangerous:     0.40   # >= 40% = likely failing keys

levels:
  2:  { damage_multiplier: 0.50 }   # Mythic 0 / M+ floor (8% per level pattern)
  3:  { damage_multiplier: 0.54 }
  4:  { damage_multiplier: 0.59 }
  5:  { damage_multiplier: 0.63 }
  6:  { damage_multiplier: 0.68 }
  7:  { damage_multiplier: 0.74 }
  8:  { damage_multiplier: 0.80 }
  9:  { damage_multiplier: 0.86 }
  10: { damage_multiplier: 0.93 }
  11: { damage_multiplier: 1.00 }   # calibration baseline anchor
  12: { damage_multiplier: 1.08 }   # WR+12 log anchor
  13: { damage_multiplier: 1.17 }   # PoS+13 log anchor
  14: { damage_multiplier: 1.26 }   # WR+14 log anchor
  15: { damage_multiplier: 1.36 }
  16: { damage_multiplier: 1.47 }
  17: { damage_multiplier: 1.59 }
  18: { damage_multiplier: 1.72 }
  19: { damage_multiplier: 1.86 }
  20: { damage_multiplier: 2.00 }
  # Extended ceiling 2026-05-21 — Brutoh's user-feedback ask: "should
  # go up to +24 or so (world records sit there, for comparison)".
  # Continues the ~8% per level pattern; not log-anchored but matches
  # the WR+12/+13/+14 trajectory and lets the verdict frame what
  # title-pushers face.
  21: { damage_multiplier: 2.16 }
  22: { damage_multiplier: 2.33 }
  23: { damage_multiplier: 2.52 }
  24: { damage_multiplier: 2.72 }
