# simf weekly audit — the two ci.yml checks that don't need to run on
# every PR: pip-audit (CVE data doesn't change minute-to-minute, so a
# per-PR run adds no new signal over a weekly one) and gitleaks's
# full-history secret scan (old commits don't change and were already
# scanned clean, so ci.yml only scans each PR's own new commits and this
# workflow covers the rest on a weekly cadence instead).

name: weekly-audit

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,ui,api]

      - name: Pip-audit (known CVEs in installed dependencies)
        run: pip-audit

      - name: Install gitleaks
        # Pinned release tarball, checksum-verified against gitleaks' own
        # published release manifest before extracting. Bump
        # GITLEAKS_VERSION here AND in ci.yml when updating.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          cd /tmp
          curl -sLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum -c <(grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt")
          tar -xz -C /usr/local/bin -f "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks

      - name: Gitleaks (secret scan, full history)
        run: gitleaks git --log-opts="--all"
